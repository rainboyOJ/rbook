<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">三路快速排序的四段区间不变量与两种交换操作</title>
  <desc id="desc">数组区间 [l, r] 被指针 L、i、R 分为四段：[l, L-1] 小于 key，[L, i-1] 等于 key，[i, R] 未检查，[R+1, r] 大于 key。遇到小于 key 的元素时与 L 交换并同时右移 L 和 i；遇到大于 key 的元素时与 R 交换并左移 R，i 保持不动。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2F5D8A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9A5B13"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#444444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="350" fill="#F2F2F2" stroke="none"/>

  <!-- 顶部总标题 -->
  <text x="380" y="32" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">
    扫描过程中的四段区间不变量
  </text>

  <!-- 9 个格子：起始 x = 110，每格宽 60，高 48，y = 88 -->
  <!-- 0,1: < key -->
  <rect x="110" y="88" width="60" height="48" fill="#DCE8F5" stroke="#2F5D8A" stroke-width="1.4"/>
  <rect x="170" y="88" width="60" height="48" fill="#DCE8F5" stroke="#2F5D8A" stroke-width="1.4"/>
  <!-- 2,3: == key -->
  <rect x="230" y="88" width="60" height="48" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
  <rect x="290" y="88" width="60" height="48" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
  <!-- 4,5,6: 未检查 [i, R] -->
  <rect x="350" y="88" width="60" height="48" fill="#F8F8F8" stroke="#777777" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="410" y="88" width="60" height="48" fill="#F8F8F8" stroke="#777777" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="470" y="88" width="60" height="48" fill="#F8F8F8" stroke="#777777" stroke-width="1.3" stroke-dasharray="4 3"/>
  <!-- 7,8: > key -->
  <rect x="530" y="88" width="60" height="48" fill="#F7E8D0" stroke="#9A5B13" stroke-width="1.4"/>
  <rect x="590" y="88" width="60" height="48" fill="#F7E8D0" stroke="#9A5B13" stroke-width="1.4"/>

  <!-- 指针箭头 L(x=260), i(x=380), R(x=500) -->
  <line x1="260" y1="64" x2="260" y2="83" stroke="#2F5D8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <line x1="380" y1="64" x2="380" y2="83" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <line x1="500" y1="64" x2="500" y2="83" stroke="#9A5B13" stroke-width="1.8" marker-end="url(#arrow-gray)"/>

  <!-- 格子内容与指针标签 -->
  <g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" text-anchor="middle">
    <text x="260" y="57" font-size="15" font-weight="bold" fill="#2F5D8A">L</text>
    <text x="380" y="57" font-size="15" font-weight="bold" fill="#222222">i</text>
    <text x="500" y="57" font-size="15" font-weight="bold" fill="#9A5B13">R</text>

    <g font-size="16" fill="#2F5D8A">
      <text x="140" y="118">&lt; key</text>
      <text x="200" y="118">&lt; key</text>
    </g>
    <g font-size="16" fill="#222222">
      <text x="260" y="118">= key</text>
      <text x="320" y="118">= key</text>
    </g>
    <g font-size="17" fill="#666666">
      <text x="380" y="118">?</text>
      <text x="440" y="118">?</text>
      <text x="500" y="118">?</text>
    </g>
    <g font-size="16" fill="#9A5B13">
      <text x="560" y="118">&gt; key</text>
      <text x="620" y="118">&gt; key</text>
    </g>

    <!-- 区间括号标注 -->
    <g font-size="13" fill="#555555">
      <text x="170" y="156">[l, L-1]</text>
      <text x="290" y="156">[L, i-1]</text>
      <text x="440" y="156">[i, R]（未检查）</text>
      <text x="590" y="156">[R+1, r]</text>
    </g>
  </g>

  <!-- 分隔线 -->
  <line x1="40" y1="180" x2="720" y2="180" stroke="#D5D5D5" stroke-width="1"/>
  <line x1="380" y1="194" x2="380" y2="332" stroke="#D5D5D5" stroke-width="1"/>

  <!-- 左下：(a) a[i] < key -->
  <g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" text-anchor="middle">
    <text x="195" y="210" font-size="15" font-weight="bold" fill="#2F5D8A">(a) a[i] &lt; key：换到左边，L++ 且 i++</text>
    <!-- 示意：L(=) 与 i(<) -->
    <rect x="115" y="240" width="54" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
    <rect x="225" y="240" width="54" height="40" fill="#DCE8F5" stroke="#2F5D8A" stroke-width="1.5"/>
    <text x="142" y="234" font-size="13" font-weight="bold" fill="#2F5D8A">L</text>
    <text x="252" y="234" font-size="13" font-weight="bold" fill="#222222">i</text>
    <text x="142" y="266" font-size="15" fill="#222222">= key</text>
    <text x="252" y="266" font-size="15" fill="#2F5D8A">&lt; key</text>
    <!-- 双向交换弧线 -->
    <path d="M 148 284 Q 197 308 246 284" fill="none" stroke="#2F5D8A" stroke-width="1.8" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
    <text x="197" y="324" font-size="13" fill="#444444">换来的是已知 = key，不用再查，i 可右移</text>
  </g>

  <!-- 右下：(b) a[i] > key -->
  <g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" text-anchor="middle">
    <text x="565" y="210" font-size="15" font-weight="bold" fill="#9A5B13">(b) a[i] &gt; key：换到右边，R--（i 不动）</text>
    <!-- 示意：i(>) 与 R(?) -->
    <rect x="485" y="240" width="54" height="40" fill="#F7E8D0" stroke="#9A5B13" stroke-width="1.5"/>
    <rect x="595" y="240" width="54" height="40" fill="#F8F8F8" stroke="#777777" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="512" y="234" font-size="13" font-weight="bold" fill="#222222">i</text>
    <text x="622" y="234" font-size="13" font-weight="bold" fill="#9A5B13">R</text>
    <text x="512" y="266" font-size="15" fill="#9A5B13">&gt; key</text>
    <text x="622" y="266" font-size="16" fill="#666666">?</text>
    <!-- 双向交换弧线 -->
    <path d="M 518 284 Q 567 308 616 284" fill="none" stroke="#9A5B13" stroke-width="1.8" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
    <text x="567" y="324" font-size="13" fill="#444444">换来的是未知元素 ?，必须留在 i 原地再查</text>
  </g>
</svg>
