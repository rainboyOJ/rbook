<svg xmlns="http://www.w3.org/2000/svg" width="700" height="365" viewBox="0 0 700 365" role="img" aria-labelledby="title desc"><title id="title">根的割点判定与点双出块不同</title><desc id="desc">左图根一仅有树孩子二，三经回边到一，根不是割点但仍输出整个三角形；右图根一有两个树孩子，是割点，并属于两个两点分量。</desc><rect width="700" height="365" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><text x="175" y="25" font-size="19" text-anchor="middle" fill="#222">一个 DFS 孩子</text><text x="525" y="25" font-size="19" text-anchor="middle" fill="#222">两个 DFS 孩子</text><line x1="175" y1="65" x2="95" y2="200" stroke="#222" stroke-width="2.4"/><line x1="95" y1="200" x2="255" y2="200" stroke="#222" stroke-width="2.4"/><line x1="255" y1="200" x2="175" y2="65" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="525" y1="65" x2="445" y2="200" stroke="#222" stroke-width="2.4"/><line x1="525" y1="65" x2="605" y2="200" stroke="#222" stroke-width="2.4"/><circle cx="175" cy="65" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="175" y="72" font-size="21" text-anchor="middle" fill="#222">1</text><circle cx="95" cy="200" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="95" y="207" font-size="21" text-anchor="middle" fill="#222">2</text><circle cx="255" cy="200" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="255" y="207" font-size="21" text-anchor="middle" fill="#222">3</text><circle cx="525" cy="65" r="22" fill="white" stroke="#222" stroke-width="2.8"/><text x="525" y="72" font-size="21" text-anchor="middle" fill="#222">1</text><circle cx="445" cy="200" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="445" y="207" font-size="21" text-anchor="middle" fill="#222">2</text><circle cx="605" cy="200" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="605" y="207" font-size="21" text-anchor="middle" fill="#222">3</text><text x="175" y="265" font-size="18" text-anchor="middle" fill="#222">根 1 不是割点</text><text x="175" y="300" font-size="18" text-anchor="middle" fill="#222">仍输出 {1,2,3}</text><text x="525" y="265" font-size="18" text-anchor="middle" fill="#222">根 1 是割点</text><text x="525" y="300" font-size="18" text-anchor="middle" fill="#222">输出 {1,2}、{1,3}</text><text x="350" y="342" font-size="17" text-anchor="middle" fill="#222">左图虚线为回边；出块判断对根同样生效</text></g></svg>
