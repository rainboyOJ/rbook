<svg xmlns="http://www.w3.org/2000/svg" width="800" height="395" viewBox="0 0 800 395" role="img" aria-labelledby="title desc"><title id="title">样例中边栈随出块逐段缩短</title><desc id="desc">进入六后七条边在栈内；弹五六后剩六条，弹五三、四五、三四后剩一二、二三、三一，最后弹出剩余三条，栈清空。孤立点七另行输出。</desc><rect width="800" height="395" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><text x="172" y="76" font-size="17" text-anchor="end" fill="#222">进入 6 后</text><rect x="196" y="48" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="230" y="76" font-size="17" text-anchor="middle" fill="#222">(1,2)</text><rect x="271" y="48" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="305" y="76" font-size="17" text-anchor="middle" fill="#222">(2,3)</text><rect x="346" y="48" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="380" y="76" font-size="17" text-anchor="middle" fill="#222">(3,1)</text><rect x="421" y="48" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="455" y="76" font-size="17" text-anchor="middle" fill="#222">(3,4)</text><rect x="496" y="48" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="530" y="76" font-size="17" text-anchor="middle" fill="#222">(4,5)</text><rect x="571" y="48" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="605" y="76" font-size="17" text-anchor="middle" fill="#222">(5,3)</text><rect x="646" y="48" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="680" y="76" font-size="17" text-anchor="middle" fill="#222">(5,6)</text><text x="172" y="156" font-size="17" text-anchor="end" fill="#222">输出 {5,6} 后</text><rect x="196" y="128" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="230" y="156" font-size="17" text-anchor="middle" fill="#222">(1,2)</text><rect x="271" y="128" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="305" y="156" font-size="17" text-anchor="middle" fill="#222">(2,3)</text><rect x="346" y="128" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="380" y="156" font-size="17" text-anchor="middle" fill="#222">(3,1)</text><rect x="421" y="128" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="455" y="156" font-size="17" text-anchor="middle" fill="#222">(3,4)</text><rect x="496" y="128" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="530" y="156" font-size="17" text-anchor="middle" fill="#222">(4,5)</text><rect x="571" y="128" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="605" y="156" font-size="17" text-anchor="middle" fill="#222">(5,3)</text><text x="172" y="236" font-size="17" text-anchor="end" fill="#222">输出 {3,4,5} 后</text><rect x="196" y="208" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="230" y="236" font-size="17" text-anchor="middle" fill="#222">(1,2)</text><rect x="271" y="208" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="305" y="236" font-size="17" text-anchor="middle" fill="#222">(2,3)</text><rect x="346" y="208" width="68" height="44" fill="white" stroke="#222" stroke-width="1.3"/><text x="380" y="236" font-size="17" text-anchor="middle" fill="#222">(3,1)</text><text x="172" y="316" font-size="17" text-anchor="end" fill="#222">输出 {1,2,3} 后</text><text x="246" y="316" font-size="18" text-anchor="middle" fill="#222">空栈</text><text x="450" y="25" font-size="17" text-anchor="middle" fill="#222">栈底在左，栈顶在右</text><text x="425" y="367" font-size="17" text-anchor="middle" fill="#222">弹出到本次树边为止；相同端点可出现在后续分量中</text></g></svg>
