<svg xmlns="http://www.w3.org/2000/svg" width="840" height="445" viewBox="0 0 840 445" role="img" aria-labelledby="title desc"><title id="title">原顶点与点双分量构成关联森林</title><desc id="desc">圆点三连接 C3 与 C2，圆点五连接 C2 与 C1；圆点七与单点分量 C4 另成一棵树。共七个圆点、四个方点、九条关联边，形成两棵树。</desc><rect width="840" height="445" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><line x1="630" y1="280" x2="630" y2="150" stroke="#222" stroke-width="1.5"/><line x1="630" y1="280" x2="630" y2="370" stroke="#222" stroke-width="1.5"/><line x1="470" y1="150" x2="310" y2="150" stroke="#222" stroke-width="1.5"/><line x1="470" y1="150" x2="470" y2="40" stroke="#222" stroke-width="1.5"/><line x1="470" y1="150" x2="630" y2="150" stroke="#222" stroke-width="1.5"/><line x1="150" y1="150" x2="60" y2="80" stroke="#222" stroke-width="1.5"/><line x1="150" y1="150" x2="60" y2="220" stroke="#222" stroke-width="1.5"/><line x1="150" y1="150" x2="310" y2="150" stroke="#222" stroke-width="1.5"/><line x1="780" y1="210" x2="780" y2="80" stroke="#222" stroke-width="1.5"/><circle cx="60" cy="80" r="20" fill="white" stroke="#222" stroke-width="1.5"/><text x="60" y="87" font-size="21" text-anchor="middle" fill="#222">1</text><circle cx="60" cy="220" r="20" fill="white" stroke="#222" stroke-width="1.5"/><text x="60" y="227" font-size="21" text-anchor="middle" fill="#222">2</text><circle cx="310" cy="150" r="20" fill="white" stroke="#222" stroke-width="2.8"/><text x="310" y="157" font-size="21" text-anchor="middle" fill="#222">3</text><circle cx="470" cy="40" r="20" fill="white" stroke="#222" stroke-width="1.5"/><text x="470" y="47" font-size="21" text-anchor="middle" fill="#222">4</text><circle cx="630" cy="150" r="20" fill="white" stroke="#222" stroke-width="2.8"/><text x="630" y="157" font-size="21" text-anchor="middle" fill="#222">5</text><circle cx="630" cy="370" r="20" fill="white" stroke="#222" stroke-width="1.5"/><text x="630" y="377" font-size="21" text-anchor="middle" fill="#222">6</text><circle cx="780" cy="80" r="20" fill="white" stroke="#222" stroke-width="1.5"/><text x="780" y="87" font-size="21" text-anchor="middle" fill="#222">7</text><rect x="605" y="255" width="50" height="50" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/><text x="630" y="286" font-size="18" text-anchor="middle" fill="#222">C1</text><rect x="445" y="125" width="50" height="50" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/><text x="470" y="156" font-size="18" text-anchor="middle" fill="#222">C2</text><rect x="125" y="125" width="50" height="50" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/><text x="150" y="156" font-size="18" text-anchor="middle" fill="#222">C3</text><rect x="755" y="185" width="50" height="50" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/><text x="780" y="216" font-size="18" text-anchor="middle" fill="#222">C4</text><text x="305" y="326" font-size="18" text-anchor="middle" fill="#222">圆点：原顶点</text><text x="305" y="359" font-size="18" text-anchor="middle" fill="#222">方点：点双分量</text><text x="405" y="418" font-size="17" text-anchor="middle" fill="#222">共享割点只保留一个圆点，分别连接所属的方点</text></g></svg>
