<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">四个点双连通分量及共享割点</title><desc id="desc">左三角形一二三为 C3，右三角形三四五为 C2，桥五六形成 C1，孤立点七形成 C4。割点三和五分别属于两个分量，灰色分量区域在割点处重叠。</desc><rect width="720" height="350" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><polygon points="40,25 110,25 300,140 110,260 40,260" fill="#f4f4f4" stroke="#aaa"/><polygon points="240,140 450,25 490,25 490,260 450,260" fill="#f4f4f4" stroke="#aaa"/><rect x="420" y="190" width="250" height="60" fill="#f4f4f4" stroke="#aaa"/><rect x="590" y="30" width="80" height="80" fill="#f4f4f4" stroke="#aaa"/><line x1="90" y1="60" x2="90" y2="220" stroke="#222" stroke-width="1.5"/><line x1="90" y1="220" x2="270" y2="140" stroke="#222" stroke-width="1.5"/><line x1="270" y1="140" x2="90" y2="60" stroke="#222" stroke-width="1.5"/><line x1="270" y1="140" x2="450" y2="60" stroke="#222" stroke-width="1.5"/><line x1="450" y1="60" x2="450" y2="220" stroke="#222" stroke-width="1.5"/><line x1="450" y1="220" x2="270" y2="140" stroke="#222" stroke-width="1.5"/><line x1="450" y1="220" x2="630" y2="220" stroke="#222" stroke-width="1.5"/><circle cx="90" cy="60" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="90" y="67" font-size="21" text-anchor="middle" fill="#222">1</text><circle cx="90" cy="220" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="90" y="227" font-size="21" text-anchor="middle" fill="#222">2</text><circle cx="270" cy="140" r="22" fill="white" stroke="#222" stroke-width="2.8"/><text x="270" y="147" font-size="21" text-anchor="middle" fill="#222">3</text><circle cx="450" cy="60" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="450" y="67" font-size="21" text-anchor="middle" fill="#222">4</text><circle cx="450" cy="220" r="22" fill="white" stroke="#222" stroke-width="2.8"/><text x="450" y="227" font-size="21" text-anchor="middle" fill="#222">5</text><circle cx="630" cy="220" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="630" y="227" font-size="21" text-anchor="middle" fill="#222">6</text><circle cx="630" cy="70" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="630" y="77" font-size="21" text-anchor="middle" fill="#222">7</text><text x="110" y="290" font-size="17" text-anchor="middle" fill="#222">C3 = {1,2,3}</text><text x="365" y="290" font-size="17" text-anchor="middle" fill="#222">C2 = {3,4,5}</text><text x="565" y="290" font-size="17" text-anchor="middle" fill="#222">C1 = {5,6}</text><text x="630" y="22" font-size="17" text-anchor="middle" fill="#222">C4 = {7}</text><text x="350" y="326" font-size="17" text-anchor="middle" fill="#222">点 3 与点 5 分别属于两个分量；顶点可以重叠</text></g></svg>
