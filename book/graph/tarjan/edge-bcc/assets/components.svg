nt-size="21" text-anchor="middle" fill="#222">4</text><circle cx="520" cy="65" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="520" y="72" font-size="21" text-anchor="middle" fill="#222">5</text><circle cx="520" cy="205" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="520" y="212" font-size="21" text-anchor="middle" fill="#222">6</text><circle cx="700" cy="205" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="700" y="212" font-size="21" text-anchor="middle" fill="#222">7</text><text x="305" y="115" font-size="18" text-anchor="middle" fill="#222">桥</text><text x="610" y="185" font-size="18" text-anchor="middle" fill="#222">桥</text><text x="395" y="278" font-size="17" text-anchor="middle" fill="#222">粗线：桥；浅灰区域：忽略桥后得到的连通块</text></g></svg>
