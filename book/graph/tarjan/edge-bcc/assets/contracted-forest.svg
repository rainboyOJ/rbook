<svg xmlns="http://www.w3.org/2000/svg" width="800" height="285" viewBox="0 0 800 285" role="img" aria-labelledby="title desc"><title id="title">三个边双缩成一棵桥树</title><desc id="desc">三个分量通过原来的两条桥连接，形成 C1、C2、C3 的路径，度数分别是一、二、一。</desc><rect width="800" height="285" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><rect x="45" y="68" width="170" height="94" fill="#f5f5f5" stroke="#222" stroke-width="1.4"/><text x="130" y="105" font-size="22" text-anchor="middle" fill="#222">C1</text><text x="130" y="140" font-size="18" text-anchor="middle" fill="#222">{1,2,3}</text><text x="130" y="210" font-size="18" text-anchor="middle" fill="#222">degree = 1</text><rect x="315" y="68" width="170" height="94" fill="#f5f5f5" stroke="#222" stroke-width="1.4"/><text x="400" y="105" font-size="22" text-anchor="middle" fill="#222">C2</text><text x="400" y="140" font-size="18" text-anchor="middle" fill="#222">{4,5,6}</text><text x="400" y="210" font-size="18" text-anchor="middle" fill="#222">degree = 2</text><rect x="585" y="68" width="170" height="94" fill="#f5f5f5" stroke="#222" stroke-width="1.4"/><text x="670" y="105" font-size="22" text-anchor="middle" fill="#222">C3</text><text x="670" y="140" font-size="18" text-anchor="middle" fill="#222">{7}</text><text x="670" y="210" font-size="18" text-anchor="middle" fill="#222">degree = 1</text><line x1="215" y1="115" x2="315" y2="115" stroke="#222" stroke-width="1.5"/><line x1="485" y1="115" x2="585" y2="115" stroke="#222" stroke-width="1.5"/><text x="265" y="94" font-size="17" text-anchor="middle" fill="#222">(3,4)</text><text x="535" y="94" font-size="17" text-anchor="middle" fill="#222">(6,7)</text><text x="400" y="259" font-size="17" text-anchor="middle" fill="#222">缩点边对应原图的桥，分量大小分别为 3、3、1</text></g></svg>
