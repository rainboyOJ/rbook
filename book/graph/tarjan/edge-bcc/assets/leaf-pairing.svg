<svg xmlns="http://www.w3.org/2000/svg" width="620" height="410" viewBox="0 0 620 410" role="img" aria-labelledby="title desc"><title id="title">跨两半配对叶子覆盖所有桥</title><desc id="desc">桥树有四个叶子一、二、三、四。新增一三和二四，形成的两个环共同覆盖全部五条树边，包括中间的五六桥。虚线是新增边。</desc><rect width="620" height="410" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><line x1="90" y1="70" x2="240" y2="170" stroke="#222" stroke-width="1.5"/><line x1="90" y1="270" x2="240" y2="170" stroke="#222" stroke-width="1.5"/><line x1="240" y1="170" x2="380" y2="170" stroke="#222" stroke-width="2.8"/><line x1="380" y1="170" x2="530" y2="70" stroke="#222" stroke-width="1.5"/><line x1="380" y1="170" x2="530" y2="270" stroke="#222" stroke-width="1.5"/><path d="M 90 70 Q 310 -5 530 70" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 90 270 Q 310 345 530 270" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="90" cy="70" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="90" y="77" font-size="21" text-anchor="middle" fill="#222">1</text><circle cx="90" cy="270" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="90" y="277" font-size="21" text-anchor="middle" fill="#222">2</text><circle cx="530" cy="70" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="530" y="77" font-size="21" text-anchor="middle" fill="#222">3</text><circle cx="530" cy="270" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="530" y="277" font-size="21" text-anchor="middle" fill="#222">4</text><circle cx="240" cy="170" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="240" y="177" font-size="21" text-anchor="middle" fill="#222">5</text><circle cx="380" cy="170" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="380" y="177" font-size="21" text-anchor="middle" fill="#222">6</text><text x="310" y="22" font-size="18" text-anchor="middle" fill="#222">新增 (1,3)</text><text x="310" y="344" font-size="18" text-anchor="middle" fill="#222">新增 (2,4)</text><text x="310" y="147" font-size="17" text-anchor="middle" fill="#222">原桥</text><text x="310" y="384" font-size="17" text-anchor="middle" fill="#222">L = 4，添加 2 条边；中间的桥也被新环覆盖</text></g></svg>
