<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-labelledby="title desc"><title id="title">边双内部仍可以存在割点</title><desc id="desc">两个三角形共用点三。没有桥，五个点属于同一个边双；点三却是割点。按一二三四五遍历，low 值分别为一一一三三，不能按 low 相等分组。</desc><rect width="560" height="330" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><rect x="40" y="25" width="480" height="235" fill="#f5f5f5" stroke="#aaa"/><line x1="90" y1="60" x2="90" y2="220" stroke="#222" stroke-width="1.5"/><line x1="90" y1="220" x2="280" y2="140" stroke="#222" stroke-width="1.5"/><line x1="280" y1="140" x2="90" y2="60" stroke="#222" stroke-width="1.5"/><line x1="280" y1="140" x2="470" y2="60" stroke="#222" stroke-width="1.5"/><line x1="470" y1="60" x2="470" y2="220" stroke="#222" stroke-width="1.5"/><line x1="470" y1="220" x2="280" y2="140" stroke="#222" stroke-width="1.5"/><circle cx="90" cy="60" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="90" y="67" font-size="21" text-anchor="middle" fill="#222">1</text><circle cx="90" cy="220" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="90" y="227" font-size="21" text-anchor="middle" fill="#222">2</text><circle cx="280" cy="140" r="22" fill="white" stroke="#222" stroke-width="2.8"/><text x="280" y="147" font-size="21" text-anchor="middle" fill="#222">3</text><circle cx="470" cy="60" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="470" y="67" font-size="21" text-anchor="middle" fill="#222">4</text><circle cx="470" cy="220" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="470" y="227" font-size="21" text-anchor="middle" fill="#222">5</text><text x="280" y="192" font-size="18" text-anchor="middle" fill="#222">割点</text><text x="280" y="302" font-size="18" text-anchor="middle" fill="#222">整个图只有 1 个边双，但删除点 3 会使图分裂</text></g></svg>
