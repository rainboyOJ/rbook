<svg xmlns="http://www.w3.org/2000/svg" width="660" height="280" viewBox="0 0 660 280" role="img" aria-labelledby="title desc"><title id="title">路径上两个最大的不同边权</title><desc id="desc">路径边权为五、五、三、三、一，最大值五，严格次大值三。新边为五时删三；新边为六时删五。</desc><rect width="660" height="280" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><text x="95" y="83" font-size="18" fill="#222" text-anchor="middle">路径边权</text><rect x="150" y="53" width="60" height="48" fill="white" stroke="#222" stroke-width="1.4"/><text x="180" y="84" font-size="22" fill="#222" text-anchor="middle">5</text><rect x="225" y="53" width="60" height="48" fill="white" stroke="#222" stroke-width="1.4"/><text x="255" y="84" font-size="22" fill="#222" text-anchor="middle">5</text><rect x="300" y="53" width="60" height="48" fill="white" stroke="#222" stroke-width="1.4"/><text x="330" y="84" font-size="22" fill="#222" text-anchor="middle">3</text><rect x="375" y="53" width="60" height="48" fill="white" stroke="#222" stroke-width="1.4"/><text x="405" y="84" font-size="22" fill="#222" text-anchor="middle">3</text><rect x="450" y="53" width="60" height="48" fill="white" stroke="#222" stroke-width="1.4"/><text x="480" y="84" font-size="22" fill="#222" text-anchor="middle">1</text><text x="330" y="151" font-size="22" fill="#222" text-anchor="middle">mx1 = 5，mx2 = 3</text><text x="330" y="206" font-size="19" fill="#222" text-anchor="middle">新边 w = 5：删 3，增量为 2</text><text x="330" y="249" font-size="19" fill="#222" text-anchor="middle">新边 w = 6：删 5，增量为 1</text></g></svg>
