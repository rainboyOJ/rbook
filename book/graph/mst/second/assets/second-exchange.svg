<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">同权最大边与严格次大边的区别</title><desc id="desc">三角形权值一、二、二。原树选择一和二，总权三；加入另一条二后，删二仍为三，删一才得到严格次小权值四。</desc><rect width="900" height="290" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><text x="150" y="27" font-size="17" fill="#222" text-anchor="middle">(a) 原 MST：1 + 2 = 3</text><line x1="60" y1="175" x2="150" y2="75" stroke="#222" stroke-width="2.8"/><line x1="150" y1="75" x2="240" y2="175" stroke="#222" stroke-width="2.8"/><line x1="60" y1="175" x2="240" y2="175" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/><rect x="84.24" y="102" width="21.52" height="23" fill="white"/><text x="95" y="120" font-size="18" fill="#222" text-anchor="middle">1</text><rect x="194.24" y="102" width="21.52" height="23" fill="white"/><text x="205" y="120" font-size="18" fill="#222" text-anchor="middle">2</text><rect x="139.24" y="184" width="21.52" height="23" fill="white"/><text x="150" y="202" font-size="18" fill="#222" text-anchor="middle">2</text><circle cx="60" cy="175" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="60" y="181.12" font-size="18" fill="#222" text-anchor="middle">1</text><circle cx="150" cy="75" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="150" y="81.12" font-size="18" fill="#222" text-anchor="middle">2</text><circle cx="240" cy="175" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="240" y="181.12" font-size="18" fill="#222" text-anchor="middle">3</text><text x="450" y="27" font-size="17" fill="#222" text-anchor="middle">(b) 删 2：同权 MST，3</text><line x1="360" y1="175" x2="450" y2="75" stroke="#222" stroke-width="2.8"/><line x1="450" y1="75" x2="540" y2="175" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="360" y1="175" x2="540" y2="175" stroke="#222" stroke-width="2.8"/><rect x="384.24" y="102" width="21.52" height="23" fill="white"/><text x="395" y="120" font-size="18" fill="#222" text-anchor="middle">1</text><rect x="494.24" y="102" width="21.52" height="23" fill="white"/><text x="505" y="120" font-size="18" fill="#222" text-anchor="middle">2</text><rect x="439.24" y="184" width="21.52" height="23" fill="white"/><text x="450" y="202" font-size="18" fill="#222" text-anchor="middle">2</text><circle cx="360" cy="175" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="360" y="181.12" font-size="18" fill="#222" text-anchor="middle">1</text><circle cx="450" cy="75" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="450" y="81.12" font-size="18" fill="#222" text-anchor="middle">2</text><circle cx="540" cy="175" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="540" y="181.12" font-size="18" fill="#222" text-anchor="middle">3</text><text x="750" y="27" font-size="17" fill="#222" text-anchor="middle">(c) 删 1：严格增加到 4</text><line x1="660" y1="175" x2="750" y2="75" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="750" y1="75" x2="840" y2="175" stroke="#222" stroke-width="2.8"/><line x1="660" y1="175" x2="840" y2="175" stroke="#222" stroke-width="2.8"/><rect x="684.24" y="102" width="21.52" height="23" fill="white"/><text x="695" y="120" font-size="18" fill="#222" text-anchor="middle">1</text><rect x="794.24" y="102" width="21.52" height="23" fill="white"/><text x="805" y="120" font-size="18" fill="#222" text-anchor="middle">2</text><rect x="739.24" y="184" width="21.52" height="23" fill="white"/><text x="750" y="202" font-size="18" fill="#222" text-anchor="middle">2</text><circle cx="660" cy="175" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="660" y="181.12" font-size="18" fill="#222" text-anchor="middle">1</text><circle cx="750" cy="75" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="750" y="81.12" font-size="18" fill="#222" text-anchor="middle">2</text><circle cx="840" cy="175" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="840" y="181.12" font-size="18" fill="#222" text-anchor="middle">3</text><text x="450" y="262" font-size="17" fill="#222" text-anchor="middle">非树边的权值为 2：删同权边只会换一棵 MST，删更轻的边才严格增加</text></g></svg>
