<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" role="img" aria-labelledby="title desc"><title id="title">删去最大边后比较跨切边</title><desc id="desc">图为反证中的假设。删去树路径上权四的边 e，得到两部分；若存在每条边都小于四的替代路径，其中跨切边 f 也小于四，可以换掉 e 并降低生成树总权值，矛盾。</desc><rect width="720" height="345" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><rect x="30" y="48" width="290" height="235" fill="#f8f8f8" stroke="#aaa"/><rect x="400" y="48" width="290" height="235" fill="#f8f8f8" stroke="#aaa"/><text x="175" y="29" font-size="18" fill="#222" text-anchor="middle">删边后的分量 Su</text><text x="545" y="29" font-size="18" fill="#222" text-anchor="middle">删边后的分量 Sv</text><line x1="100" y1="110" x2="280" y2="110" stroke="#222" stroke-width="1.6"/><line x1="280" y1="110" x2="240" y2="240" stroke="#222" stroke-width="1.6"/><line x1="440" y1="110" x2="480" y2="240" stroke="#222" stroke-width="1.6"/><line x1="440" y1="110" x2="620" y2="110" stroke="#222" stroke-width="1.6"/><line x1="280" y1="110" x2="440" y2="110" stroke="#777" stroke-width="2.4" stroke-dasharray="10 5"/><rect x="316.92" y="68" width="86.16" height="22" fill="white"/><text x="360" y="85" font-size="17" fill="#222" text-anchor="middle">e：W = 4</text><line x1="100" y1="110" x2="240" y2="240" stroke="#222" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="240" y1="240" x2="480" y2="240" stroke="#222" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="480" y1="240" x2="620" y2="110" stroke="#222" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="295.15999999999997" y="208" width="129.68" height="22" fill="white"/><text x="360" y="225" font-size="17" fill="#222" text-anchor="middle">假设 w(f) &lt; 4</text><circle cx="100" cy="110" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="100" y="116.12" font-size="18" fill="#222" text-anchor="middle">u</text><circle cx="280" cy="110" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="280" y="116.12" font-size="18" fill="#222" text-anchor="middle">a</text><circle cx="240" cy="240" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="240" y="246.12" font-size="18" fill="#222" text-anchor="middle">c</text><circle cx="440" cy="110" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="440" y="116.12" font-size="18" fill="#222" text-anchor="middle">b</text><circle cx="620" cy="110" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="620" y="116.12" font-size="18" fill="#222" text-anchor="middle">v</text><circle cx="480" cy="240" r="18" fill="white" stroke="#222" stroke-width="1.5"/><text x="480" y="246.12" font-size="18" fill="#222" text-anchor="middle">d</text><text x="360" y="318" font-size="16" fill="#222" text-anchor="middle">若存在瓶颈更小的虚线路径，用跨切边 f 换回就能让树更轻</text></g></svg>
