<svg xmlns="http://www.w3.org/2000/svg" width="680" height="285" viewBox="0 0 680 285" role="img" aria-labelledby="title desc"><title id="title">入树代价与最短路距离的区别</title><desc id="desc">三角形一二权二、二三权二、一三权三。Prim 经由二接入三，只看边权二；从一到三的最短路却是直接边，距离三。</desc><rect width="680" height="285" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><line x1="100" y1="140" x2="340" y2="60" stroke="#222" stroke-width="2.8"/><line x1="340" y1="60" x2="580" y2="140" stroke="#222" stroke-width="2.8"/><line x1="100" y1="140" x2="580" y2="140" stroke="#222" stroke-width="1.4"/><circle cx="100" cy="140" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="100" y="146.8" font-size="20" fill="#222" text-anchor="middle">1</text><circle cx="340" cy="60" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="340" y="66.8" font-size="20" fill="#222" text-anchor="middle">2</text><circle cx="580" cy="140" r="22" fill="white" stroke="#222" stroke-width="1.5"/><text x="580" y="146.8" font-size="20" fill="#222" text-anchor="middle">3</text><rect x="204.24" y="67" width="21.52" height="23" fill="white"/><text x="215" y="85" font-size="18" fill="#222" text-anchor="middle">2</text><rect x="454.24" y="67" width="21.52" height="23" fill="white"/><text x="465" y="85" font-size="18" fill="#222" text-anchor="middle">2</text><rect x="329.24" y="145" width="21.52" height="23" fill="white"/><text x="340" y="163" font-size="18" fill="#222" text-anchor="middle">3</text><text x="340" y="223" font-size="18" fill="#222" text-anchor="middle">Prim：接入 3 的代价为 2，树的总权值为 4</text><text x="340" y="258" font-size="18" fill="#222" text-anchor="middle">Dijkstra：从 1 到 3 的最短距离为 3</text></g></svg>
