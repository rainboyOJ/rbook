<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" role="img"><title>无向图欧拉路的度数与连通条件</title><desc>圆内数字为度数，粗圈表示奇度点。三角形可构成回路，三点链可构成开放路，三叶星形奇点过多，两个分离的三角形不连通。</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="700" height="520" fill="white"/><g font-family="Noto Serif CJK SC, Source Han Serif SC, serif" fill="#222" font-size="19"><text x="350" y="27" font-size="18" text-anchor="middle">圆内数字为度数；粗圈表示奇度点</text><text x="175" y="70" font-size="19" text-anchor="middle">（a）零个奇度点</text><line x1="163.14" y1="126.10" x2="116.86" y2="188.90" stroke="#222" stroke-width="1.5"/><line x1="125.00" y1="205.00" x2="225.00" y2="205.00" stroke="#222" stroke-width="1.5"/><line x1="233.14" y1="188.90" x2="186.86" y2="126.10" stroke="#222" stroke-width="1.5"/><circle cx="175" cy="110" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="175" y="116" font-size="20" text-anchor="middle">2</text><circle cx="105" cy="205" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="105" y="211" font-size="20" text-anchor="middle">2</text><circle cx="245" cy="205" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="245" y="211" font-size="20" text-anchor="middle">2</text><text x="175" y="253" font-size="18" text-anchor="middle">存在欧拉回路</text><text x="525" y="70" font-size="19" text-anchor="middle">（b）两个奇度点</text><line x1="435.00" y1="165.00" x2="505.00" y2="165.00" stroke="#222" stroke-width="1.5"/><line x1="545.00" y1="165.00" x2="615.00" y2="165.00" stroke="#222" stroke-width="1.5"/><circle cx="415" cy="165" r="19" fill="white" stroke="#222" stroke-width="2.8"/><text x="415" y="171" font-size="20" text-anchor="middle">1</text><circle cx="525" cy="165" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="525" y="171" font-size="20" text-anchor="middle">2</text><circle cx="635" cy="165" r="19" fill="white" stroke="#222" stroke-width="2.8"/><text x="635" y="171" font-size="20" text-anchor="middle">1</text><text x="525" y="253" font-size="18" text-anchor="middle">存在开放的欧拉路</text><text x="175" y="310" font-size="19" text-anchor="middle">（c）四个奇度点</text><line x1="157.11" y1="386.06" x2="102.89" y2="358.94" stroke="#222" stroke-width="1.5"/><line x1="192.89" y1="386.06" x2="247.11" y2="358.94" stroke="#222" stroke-width="1.5"/><line x1="175.00" y1="415.00" x2="175.00" y2="440.00" stroke="#222" stroke-width="1.5"/><circle cx="175" cy="395" r="19" fill="white" stroke="#222" stroke-width="2.8"/><text x="175" y="401" font-size="20" text-anchor="middle">3</text><circle cx="85" cy="350" r="19" fill="white" stroke="#222" stroke-width="2.8"/><text x="85" y="356" font-size="20" text-anchor="middle">1</text><circle cx="265" cy="350" r="19" fill="white" stroke="#222" stroke-width="2.8"/><text x="265" y="356" font-size="20" text-anchor="middle">1</text><circle cx="175" cy="460" r="19" fill="white" stroke="#222" stroke-width="2.8"/><text x="175" y="466" font-size="20" text-anchor="middle">1</text><text x="175" y="493" font-size="18" text-anchor="middle">不存在欧拉路</text><text x="525" y="310" font-size="19" text-anchor="middle">（d）度数全偶，图不连通</text><line x1="421.06" y1="377.89" x2="398.94" y2="422.11" stroke="#222" stroke-width="1.5"/><line x1="410.00" y1="440.00" x2="450.00" y2="440.00" stroke="#222" stroke-width="1.5"/><line x1="461.06" y1="422.11" x2="438.94" y2="377.89" stroke="#222" stroke-width="1.5"/><line x1="601.06" y1="377.89" x2="578.94" y2="422.11" stroke="#222" stroke-width="1.5"/><line x1="590.00" y1="440.00" x2="630.00" y2="440.00" stroke="#222" stroke-width="1.5"/><line x1="641.06" y1="422.11" x2="618.94" y2="377.89" stroke="#222" stroke-width="1.5"/><circle cx="430" cy="360" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="430" y="366" font-size="20" text-anchor="middle">2</text><circle cx="390" cy="440" r="19" fill="white" stroke="#222" stroke-width="1.4"/><