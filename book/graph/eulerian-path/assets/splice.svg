<svg xmlns="http://www.w3.org/2000/svg" width="700" height="415" viewBox="0 0 700 415" role="img"><title>逆序出栈完成回路拼接</title><desc>先使用一二和二五两条边，到达五号终点。五号先出栈，再返回二号点处理二三四环，反转出栈顺序后小环插在二五之前。虚线表示先前已经使用的边。</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="700" height="415" fill="white"/><g font-family="Noto Serif CJK SC, Source Han Serif SC, serif" fill="#222" font-size="19"><text x="175" y="28" font-size="19" text-anchor="middle">（a）先走 1 → 2 → 5</text><line x1="65.00" y1="160.00" x2="130.00" y2="160.00" stroke="#222" stroke-width="2"/><line x1="170.00" y1="160.00" x2="250.00" y2="160.00" stroke="#222" stroke-width="2"/><line x1="139.98" y1="142.69" x2="105.02" y2="82.31" stroke="#222" stroke-width="1.2"/><line x1="115.00" y1="65.00" x2="185.00" y2="65.00" stroke="#222" stroke-width="1.2"/><line x1="194.98" y1="82.31" x2="160.02" y2="142.69" stroke="#222" stroke-width="1.2"/><circle cx="45" cy="160" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="45" y="166" font-size="20" text-anchor="middle">1</text><circle cx="150" cy="160" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="150" y="166" font-size="20" text-anchor="middle">2</text><circle cx="270" cy="160" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="270" y="166" font-size="20" text-anchor="middle">5</text><circle cx="95" cy="65" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="95" y="71" font-size="20" text-anchor="middle">3</text><circle cx="205" cy="65" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="205" y="71" font-size="20" text-anchor="middle">4</text><text x="175" y="220" font-size="18" text-anchor="middle">2–3–4–2 尚未使用</text><text x="525" y="28" font-size="19" text-anchor="middle">（b）5 出栈，再处理小环</text><line x1="415.00" y1="160.00" x2="480.00" y2="160.00" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="520.00" y1="160.00" x2="600.00" y2="160.00" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="489.98" y1="142.69" x2="455.02" y2="82.31" stroke="#222" stroke-width="2"/><line x1="465.00" y1="65.00" x2="535.00" y2="65.00" stroke="#222" stroke-width="2"/><line x1="544.98" y1="82.31" x2="510.02" y2="142.69" stroke="#222" stroke-width="2"/><circle cx="395" cy="160" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="395" y="166" font-size="20" text-anchor="middle">1</text><circle cx="500" cy="160" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="500" y="166" font-size="20" text-anchor="middle">2</text><circle cx="620" cy="160" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="620" y="166" font-size="20" text-anchor="middle">5</text><circle cx="445" cy="65" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="445" y="71" font-size="20" text-anchor="middle">3</text><circle cx="555" cy="65" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="555" y="71" font-size="20" text-anchor="middle">4</text><text x="525" y="220" font-size="18" text-anchor="middle">虚线边已经使用</text><line x1="30" y1="250" x2="670" y2="250" stroke="#aaa" stroke-width="1"/><text x="350" y="290" font-size="21" text-anchor="middle">出栈顺序：5, 2, 4, 3, 2, 1</text><text x="350" y="335" font-size="18" text-anchor="middle">反转</text><text x="350" y="380" font-size="22" text-anchor="middle">最终路径：1 → 2 → 3 → 4 → 2 → 5</text></g></svg>
