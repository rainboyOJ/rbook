<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img"><title>有向欧拉路的起点与终点</title><desc>一到二、二到五、二到三、三到四、四到二。顶点一的出度减入度为一，顶点五为负一，其他点为零。</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="700" height="300" fill="white"/><g font-family="Noto Serif CJK SC, Source Han Serif SC, serif" fill="#222" font-size="19"><line x1="85.00" y1="175.00" x2="270.00" y2="175.00" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310.00" y1="175.00" x2="610.00" y2="175.00" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="283.94" y1="155.94" x2="261.06" y2="84.06" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="275.00" y1="65.00" x2="410.00" y2="65.00" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="414.27" y1="77.36" x2="305.73" y2="162.64" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="65" cy="175" r="19" fill="white" stroke="#222" stroke-width="2.8"/><text x="65" y="181" font-size="20" text-anchor="middle">1</text><circle cx="290" cy="175" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="290" y="181" font-size="20" text-anchor="middle">2</text><circle cx="630" cy="175" r="19" fill="white" stroke="#222" stroke-width="2.8"/><text x="630" y="181" font-size="20" text-anchor="middle">5</text><circle cx="255" cy="65" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="255" y="71" font-size="20" text-anchor="middle">3</text><circle cx="430" cy="65" r="19" fill="white" stroke="#222" stroke-width="1.4"/><text x="430" y="71" font-size="20" text-anchor="middle">4</text><text x="65" y="222" font-size="18" text-anchor="middle">out−in = 1</text><text x="290" y="222" font-size="18" text-anchor="middle">out−in = 0</text><text x="630" y="222" font-size="18" text-anchor="middle">out−in = −1</text><text x="350" y="278" font-size="19" text-anchor="middle">1 是起点，5 是终点；2、3、4 出入度平衡</text></g></svg>
