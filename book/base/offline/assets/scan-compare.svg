<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340">
  <title>两种扫描顺序的对照</title>
  <desc>左图按位置扫描：外层按原下标从小到大，内层树状数组下标取值域，值域跨度大时需先离散化。右图按值扫描：外层按数值从大到小并分组，内层树状数组下标取原下标，原下标天然连续，无需离散化。</desc>
  <defs>
    <marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#2b5b84" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="340" fill="#F2F2F2" stroke="none"/>
  <g font-family="'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
    <text x="210" y="34" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">（a）按位置扫描</text>
    <text x="26" y="88" font-size="13" fill="#777777" text-anchor="middle">原下标</text>
    <text x="85.0" y="54" font-size="13" fill="#777777" text-anchor="middle">1</text>
    <rect x="56" y="62" width="58" height="42" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="85.0" y="90" font-size="20" fill="#222222" text-anchor="middle">3</text>
    <text x="151.0" y="54" font-size="13" fill="#777777" text-anchor="middle">2</text>
    <rect x="122" y="62" width="58" height="42" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="151.0" y="90" font-size="20" fill="#222222" text-anchor="middle">1</text>
    <text x="217.0" y="54" font-size="13" fill="#777777" text-anchor="middle">3</text>
    <rect x="188" y="62" width="58" height="42" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="217.0" y="90" font-size="20" fill="#222222" text-anchor="middle">3</text>
    <text x="283.0" y="54" font-size="13" fill="#777777" text-anchor="middle">4</text>
    <rect x="254" y="62" width="58" height="42" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="283.0" y="90" font-size="20" fill="#222222" text-anchor="middle">2</text>
    <text x="349.0" y="54" font-size="13" fill="#777777" text-anchor="middle">5</text>
    <rect x="320" y="62" width="58" height="42" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
    <text x="349.0" y="90" font-size="20" fill="#222222" text-anchor="middle">1</text>
    <line x1="58" y1="130" x2="374" y2="130" stroke="#2b5b84" stroke-width="1.4" marker-end="url(#arw)"/>
    <text x="210" y="154" font-size="14" fill="#2b5b84" text-anchor="middle">外层：按原下标 j 从小到大</text>
    <text x="210" y="190" font-size="14" fill="#444444" text-anchor="middle">内层：树状数组下标取「值域」</text>
    <rect x="122" y="206" width="58" height="38" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="151" y="232" font-size="16" fill="#444444" text-anchor="middle">1</text>
    <rect x="190" y="206" width="58" height="38" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="219" y="232" font-size="16" fill="#444444" text-anchor="middle">2</text>
    <rect x="258" y="206" width="58" height="38" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="287" y="232" font-size="16" fill="#444444" text-anchor="middle">3</text>
    <text x="210" y="272" font-size="13" fill="#777777" text-anchor="middle">值域跨度大时，需先离散化为 1…m</text>
    <line x1="410" y1="22" x2="410" y2="300" stroke="#DEDEDE" stroke-width="1.0"/>
    <text x="612" y="34" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">（b）按值扫描</text>
    <text x="448" y="48" font-size="13" fill="#777777" text-anchor="middle">值</text>
    <rect x="436" y="56" width="26" height="30" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="449" y="77" font-size="16" fill="#444444" text-anchor="middle">3</text>
    <rect x="492" y="56" width="78" height="30" fill="#FFFFFF" stroke="#222222" stroke-width="1.0"/>
    <text x="531.0" y="77" font-size="15" fill="#222222" text-anchor="middle">(3,1)</text>
    <rect x="580" y="56" width="78" height="30" fill="#FFFFFF" stroke="#222222" stroke-width="1.0"/>
    <text x="619.0" y="77" font-size="15" fill="#222222" text-anchor="middle">(3,3)</text>
    <rect x="436" y="94" width="26" height="30" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="449" y="115" font-size="16" fill="#444444" text-anchor="middle">2</text>
    <rect x="492" y="94" width="78" height="30" fill="#FFFFFF" stroke="#222222" stroke-width="1.0"/>
    <text x="531.0" y="115" font-size="15" fill="#222222" text-anchor="middle">(2,4)</text>
    <rect x="436" y="132" width="26" height="30" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="449" y="153" font-size="16" fill="#444444" text-anchor="middle">1</text>
    <rect x="492" y="132" width="78" height="30" fill="#FFFFFF" stroke="#2b5b84" stroke-width="1.4"/>
    <text x="531.0" y="153" font-size="15" fill="#222222" text-anchor="middle">(1,2)</text>
    <rect x="580" y="132" width="78" height="30" fill="#FFFFFF" stroke="#2b5b84" stroke-width="1.4"/>
    <text x="619.0" y="153" font-size="15" fill="#222222" text-anchor="middle">(1,5)</text>
    <line x1="418" y1="58" x2="418" y2="160" stroke="#2b5b84" stroke-width="1.4" marker-end="url(#arw)"/>
    <text x="612" y="196" font-size="14" fill="#2b5b84" text-anchor="middle">外层：数值从大到小，同值分组</text>
    <text x="612" y="232" font-size="14" fill="#444444" text-anchor="middle">内层：树状数组下标取「原下标」</text>
    <rect x="452" y="248" width="50" height="34" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="477.0" y="272" font-size="16" fill="#444444" text-anchor="middle">1</text>
    <rect x="510" y="248" width="50" height="34" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="535.0" y="272" font-size="16" fill="#444444" text-anchor="middle">2</text>
    <rect x="568" y="248" width="50" height="34" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="593.0" y="272" font-size="16" fill="#444444" text-anchor="middle">3</text>
    <rect x="626" y="248" width="50" height="34" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="651.0" y="272" font-size="16" fill="#444444" text-anchor="middle">4</text>
    <rect x="684" y="248" width="50" height="34" fill="#F7F9FB" stroke="#777777" stroke-width="1.1"/>
    <text x="709.0" y="272" font-size="16" fill="#444444" text-anchor="middle">5</text>
    <text x="612" y="308" font-size="13" fill="#777777" text-anchor="middle">原下标 1…n 天然连续，无需离散化</text>
  </g>
</svg>
