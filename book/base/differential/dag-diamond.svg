<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="330" height="190" viewBox="0 0 330 190">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0.9 L 7.6 4 L 0 7.1 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="330" height="190" fill="#ffffff"/>

  <!-- 边：4 -> 2, 4 -> 3, 2 -> 1, 3 -> 1 -->
  <g stroke="#000000" stroke-width="1.1" fill="none" stroke-linecap="round">
    <line x1="55.2" y1="85.3" x2="144.8" y2="55.1" marker-end="url(#arrow)"/>
    <line x1="55.2" y1="94.7" x2="144.8" y2="124.9" marker-end="url(#arrow)"/>
    <line x1="175.2" y1="55.1" x2="264.8" y2="84.9" marker-end="url(#arrow)"/>
    <line x1="175.2" y1="124.9" x2="264.8" y2="95.1" marker-end="url(#arrow)"/>
  </g>

  <!-- 节点 -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1.2">
    <circle cx="40"  cy="90"  r="16"/>
    <circle cx="160" cy="50"  r="16"/>
    <circle cx="160" cy="130" r="16"/>
    <circle cx="280" cy="90"  r="16"/>
  </g>

  <!-- 节点标号 -->
  <g fill="#000000" font-family="Times New Roman, Nimbus Roman, Liberation Serif, serif"
     font-size="16" text-anchor="middle">
    <text x="40"  y="96">4</text>
    <text x="160" y="56">2</text>
    <text x="160" y="136">3</text>
    <text x="280" y="96">1</text>
  </g>
</svg>
