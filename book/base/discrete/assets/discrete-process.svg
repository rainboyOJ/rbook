<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" width="550" height="420">
  <title>离散化的四个步骤</title>
  <desc>原数组为十亿、25、十亿、4、25。复制后排序得到4、25、25、十亿、十亿；去重得到4、25、十亿，其下标为1、2、3。按原数组顺序查询下标，离散化结果为3、2、3、1、2。</desc>
  <defs>
    <marker id="step-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#777777" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="550" height="420" fill="#F2F2F2" stroke="none"/>
  <g fill="#222222" font-family="'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
    <text x="24" y="60" font-size="19">1. 原数组 a</text>
    <g fill="#FFFFFF" stroke="#222222" stroke-width="1.2">
      <rect x="160" y="32" width="340" height="44"/>
      <line x1="228" y1="32" x2="228" y2="76"/>
      <line x1="296" y1="32" x2="296" y2="76"/>
      <line x1="364" y1="32" x2="364" y2="76"/>
      <line x1="432" y1="32" x2="432" y2="76"/>
    </g>
    <g font-family="'Times New Roman', serif" font-size="25" text-anchor="middle">
      <text x="194" y="62">10<tspan baseline-shift="super" font-size="16">9</tspan></text>
      <text x="262" y="62">25</text>
      <text x="330" y="62">10<tspan baseline-shift="super" font-size="16">9</tspan></text>
      <text x="398" y="62">4</text>
      <text x="466" y="62">25</text>
    </g>
    <text x="24" y="158" font-size="19">2. 排序 b</text>
    <g fill="#FFFFFF" stroke="#222222" stroke-width="1.2">
      <rect x="160" y="130" width="340" height="44"/>
      <line x1="228" y1="130" x2="228" y2="174"/>
      <line x1="296" y1="130" x2="296" y2="174"/>
      <line x1="364" y1="130" x2="364" y2="174"/>
      <line x1="432" y1="130" x2="432" y2="174"/>
    </g>
    <g font-family="'Times New Roman', serif" font-size="25" text-anchor="middle">
      <text x="194" y="160">4</text>
      <text x="262" y="160">25</text>
      <text x="330" y="160">25</text>
      <text x="398" y="160">10<tspan baseline-shift="super" font-size="16">9</tspan></text>
      <text x="466" y="160">10<tspan baseline-shift="super" font-size="16">9</tspan></text>
    </g>
    <text x="24" y="256" font-size="19">3. 去重 b</text>
    <g fill="#FFFFFF" stroke="#222222" stroke-width="1.2">
      <rect x="160" y="228" width="204" height="44"/>
      <line x1="228" y1="228" x2="228" y2="272"/>
      <line x1="296" y1="228" x2="296" y2="272"/>
    </g>
    <g font-family="'Times New Roman', serif" font-size="25" text-anchor="middle">
      <text x="194" y="258">4</text>
      <text x="262" y="258">25</text>
      <text x="330" y="258">10<tspan baseline-shift="super" font-size="16">9</tspan></text>
    </g>
    <text x="24" y="386" font-size="19">4. 离散化</text>
    <g fill="#FFFFFF" stroke="#222222" stroke-width="1.2">
      <rect x="160" y="358" width="340" height="44"/>
      <line x1="228" y1="358" x2="228" y2="402"/>
      <line x1="296" y1="358" x2="296" y2="402"/>
      <line x1="364" y1="358" x2="364" y2="402"/>
      <line x1="432" y1="358" x2="432" y2="402"/>
    </g>
    <g font-family="'Times New Roman', serif" font-size="25" text-anchor="middle">
      <text x="194" y="388">3</text>
      <text x="262" y="388">2</text>
      <text x="330" y="388">3</text>
      <text x="398" y="388">1</text>
      <text x="466" y="388">2</text>
    </g>
    <g fill="#777777" font-size="18">
      <text x="100" y="298">下标</text>
      <g font-family="'Times New Roman', serif" font-size="21" text-anchor="middle">
        <text x="194" y="298">1</text>
        <text x="262" y="298">2</text>
        <text x="330" y="298">3</text>
      </g>
    </g>
    <g fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#step-arrow)">
      <path d="M 330 84 V 116"/>
      <path d="M 330 182 V 214"/>
      <path d="M 330 312 V 344"/>
    </g>
    <text x="350" y="334" font-size="16">按原值查询下标</text>
  </g>
</svg>
