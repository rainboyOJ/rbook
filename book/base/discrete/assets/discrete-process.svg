<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410">
  <title>离散化过程示意图</title>
  <desc>展示原数组收集元素、排序去重得到字典数组，再通过二分查表将原稀疏大数值映射为紧凑下标的过程</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#222222" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="820" height="410" fill="#F2F2F2" stroke="none" />

  <!-- 阶段 1：原始数组 a -->
  <g id="step-original">
    <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" fill="#222222">① 原始数组 a (值域大，存在重复)</text>
    
    <!-- 格子 1..5 -->
    <!-- 坐标：x0 = 50, cell_w = 70, gap = 12 -->
    <!-- cell 1 -->
    <text x="85" y="72" font-family="serif" font-style="italic" font-size="13" text-anchor="middle" fill="#777777">i = 1</text>
    <rect x="50" y="80" width="70" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.4" />
    <text x="85" y="108" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#222222">10⁹</text>

    <!-- cell 2 -->
    <text x="167" y="72" font-family="serif" font-style="italic" font-size="13" text-anchor="middle" fill="#777777">i = 2</text>
    <rect x="132" y="80" width="70" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.4" />
    <text x="167" y="108" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#222222">25</text>

    <!-- cell 3 -->
    <text x="249" y="72" font-family="serif" font-style="italic" font-size="13" text-anchor="middle" fill="#777777">i = 3</text>
    <rect x="214" y="80" width="70" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.4" />
    <text x="249" y="108" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#222222">10⁹</text>

    <!-- cell 4 -->
    <text x="331" y="72" font-family="serif" font-style="italic" font-size="13" text-anchor="middle" fill="#777777">i = 4</text>
    <rect x="296" y="80" width="70" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.4" />
    <text x="331" y="108" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#222222">4</text>

    <!-- cell 5 -->
    <text x="413" y="72" font-family="serif" font-style="italic" font-size="13" text-anchor="middle" fill="#777777">i = 5</text>
    <rect x="378" y="80" width="70" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.4" />
    <text x="413" y="108" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#222222">25</text>

    <text x="480" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#666666">元素总数 n = 5，最大值高达 10⁹</text>
  </g>

  <!-- 阶段 2：排序去重得到字典数组 b -->
  <g id="step-dict">
    <!-- 下拉箭头与说明 -->
    <path d="M 249 130 L 249 170" fill="none" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)" />
    <text x="260" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#444444">排序 (sort) + 去重 (unique)</text>

    <text x="50" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" fill="#222222">② 有序去重数组 b (值域字典)</text>

    <!-- cell 1 -->
    <rect x="50" y="214" width="80" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" />
    <text x="90" y="242" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1d4ed8">4</text>
    <text x="90" y="278" font-family="serif" font-style="italic" font-size="13" text-anchor="middle" fill="#1d4ed8">idx = 1</text>

    <!-- cell 2 -->
    <rect x="142" y="214" width="80" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" />
    <text x="182" y="242" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1d4ed8">25</text>
    <text x="182" y="278" font-family="serif" font-style="italic" font-size="13" text-anchor="middle" fill="#1d4ed8">idx = 2</text>

    <!-- cell 3 -->
    <rect x="234" y="214" width="80" height="44" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="1.5" />
    <text x="274" y="242" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1d4ed8">10⁹</text>
    <text x="274" y="278" font-family="serif" font-style="italic" font-size="13" text-anchor="middle" fill="#1d4ed8">idx = 3</text>

    <!-- 映射规则说明框 -->
    <rect x="340" y="214" width="430" height="66" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
    <text x="355" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#222222">查询映射：lower_bound(b + 1, b + 1 + m, x) - b</text>
    <text x="355" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#555555">单调递增连续下标 [1, m]，本例唯一元素数量 m = 3</text>
  </g>

  <!-- 阶段 3：映射后的数组 a' -->
  <g id="step-result">
    <!-- 下拉箭头 -->
    <path d="M 249 288 L 249 320" fill="none" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow)" />
    <text x="260" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#444444">二分查下标，替换原数组</text>

    <text x="50" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" fill="#222222">③ 离散化结果数组 a′ (保序紧凑)</text>

    <!-- cell 1: 3 -->
    <rect x="50" y="352" width="70" height="40" fill="#f8fafc" stroke="#222222" stroke-width="1.4" />
    <text x="85" y="377" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">3</text>

    <!-- cell 2: 2 -->
    <rect x="132" y="352" width="70" height="40" fill="#f8fafc" stroke="#222222" stroke-width="1.4" />
    <text x="167" y="377" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">2</text>

    <!-- cell 3: 3 -->
    <rect x="214" y="352" width="70" height="40" fill="#f8fafc" stroke="#222222" stroke-width="1.4" />
    <text x="249" y="377" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">3</text>

    <!-- cell 4: 1 -->
    <rect x="296" y="352" width="70" height="40" fill="#f8fafc" stroke="#222222" stroke-width="1.4" />
    <text x="331" y="377" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">1</text>

    <!-- cell 5: 2 -->
    <rect x="378" y="352" width="70" height="40" fill="#f8fafc" stroke="#222222" stroke-width="1.4" />
    <text x="413" y="377" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d4ed8">2</text>

    <text x="480" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#222222">新值域压缩至 [1, 3]，原大小关系严格保持不变</text>
  </g>
</svg>
