<svg xmlns="http://www.w3.org/2000/svg" width="650" height="260" viewBox="0 0 650 260" role="img" aria-labelledby="title desc">
<title id="title">区间增量与差分边界</title>
<desc id="desc">原数组 2,-1,3,4,5 的区间 2 到 4 加 3 后为 2,2,6,7,5；差分由 2,-3,4,1,1 变成 2,0,4,1,-2。</desc>
