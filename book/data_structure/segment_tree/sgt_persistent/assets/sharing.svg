<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc"><title id="title">路径复制与节点共享</title><desc id="desc">把第一个元素由一改成九，新旧版本使用不同根和第一个叶子，共享第二个叶子。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222222" stroke="#222222" stroke-width="1.4"><rect x="120.0" y="40.0" width="240" height="50" fill="white" stroke-width="1.4"/><text x="240" y="71" font-size="18" text-anchor="middle" stroke="none">root[0]：旧版本</text><rect x="520.0" y="40.0" width="240" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="640" y="71" font-size="18" text-anchor="middle" stroke="none">root[1]：新版本</text><path d="M240,90 L130,200" fill="none"/><text x="199.0" y="150" font-size="16" text-anchor="middle" stroke="none">1</text><path d="M240,90 L440,200" fill="none"/><text x="354.0" y="150" font-size="16" text-anchor="middle" stroke="none">2</text><path d="M640,90 L440,200" fill="none"/><text x="554.0" y="150" font-size="16" text-anchor="middle" stroke="none">2</text><path d="M640,90 L750,200" fill="none"/><text x="709.0" y="150" font-size="16" text-anchor="middle" stroke="none">1</text><rect x="35.0" y="200.0" width="190" height="50" fill="white" stroke-width="1.4"/><text x="130" y="231" font-size="18" text-anchor="middle" stroke="none">a[1] = 1</text><rect x="330.0" y="200.0" width="220" height="50" fill="white" stroke-width="1.4"/><text x="440" y="231" font-size="18" text-anchor="middle" stroke="none">a[2] = 2：共享</text><rect x="655.0" y="200.0" width="190" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="750" y="231" font-size="18" text-anchor="middle" stroke="none">a[1] = 9</text><text x="440" y="300" font-size="17" text-anchor="middle" stroke="none">只复制被修改的路径；共享节点保持只读</text></g></svg>
