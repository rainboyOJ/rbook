<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc"><title id="title">区间加标记与下传</title><desc id="desc">初始数组为一二三四。整段加五时根已更新，孩子延迟到下传时更新。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222222" stroke="#222222" stroke-width="1.4"><text x="220" y="30" font-size="18" text-anchor="middle" stroke="none">（a）整段加 5 后</text><rect x="100.0" y="75.0" width="240" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="220" y="106" font-size="18" text-anchor="middle" stroke="none">[1,4]  sum=30  tag=5</text><path d="M220,125 L120,180" fill="none"/><path d="M220,125 L320,180" fill="none"/><rect x="27.5" y="180.0" width="185" height="50" fill="white" stroke-width="1.4"/><text x="120" y="211" font-size="18" text-anchor="middle" stroke="none">[1,2]  sum=3</text><rect x="227.5" y="180.0" width="185" height="50" fill="white" stroke-width="1.4"/><text x="320" y="211" font-size="18" text-anchor="middle" stroke="none">[3,4]  sum=7</text><text x="220" y="265" font-size="16" text-anchor="middle" stroke="none">孩子尚未计入 +5</text><text x="660" y="30" font-size="18" text-anchor="middle" stroke="none">（b）下传到孩子后</text><rect x="540.0" y="75.0" width="240" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="660" y="106" font-size="18" text-anchor="middle" stroke="none">[1,4]  sum=30  tag=0</text><path d="M660,125 L560,180" fill="none"/><path d="M660,125 L760,180" fill="none"/><rect x="467.5" y="180.0" width="185" height="50" fill="white" stroke-width="1.4"/><text x="560" y="211" font-size="18" text-anchor="middle" stroke="none">[1,2]  sum=13</text><rect x="667.5" y="180.0" width="185" height="50" fill="white" stroke-width="1.4"/><text x="760" y="211" font-size="18" text-anchor="middle" stroke="none">[3,4]  sum=17</text><text x="660" y="265" font-size="16" text-anchor="middle" stroke="none">孩子 tag 均为 5；父 tag 清零</text></g></svg>
