<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc"><title id="title">对应值域频次相加</title><desc id="desc">A 包含二四，B 包含二三，合并后值二的频次为二，其余三四各一次。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222222" stroke="#222222" stroke-width="1.4"><text x="150" y="66" font-size="18" text-anchor="middle" stroke="none">A 的频次</text><rect x="292.5" y="38.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="340" y="66" font-size="18" text-anchor="middle" stroke="none">0</text><rect x="412.5" y="38.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="460" y="66" font-size="18" text-anchor="middle" stroke="none">1</text><rect x="532.5" y="38.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="580" y="66" font-size="18" text-anchor="middle" stroke="none">0</text><rect x="652.5" y="38.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="700" y="66" font-size="18" text-anchor="middle" stroke="none">1</text><text x="150" y="151" font-size="18" text-anchor="middle" stroke="none">B 的频次</text><rect x="292.5" y="123.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="340" y="151" font-size="18" text-anchor="middle" stroke="none">0</text><rect x="412.5" y="123.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="460" y="151" font-size="18" text-anchor="middle" stroke="none">1</text><rect x="532.5" y="123.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="580" y="151" font-size="18" text-anchor="middle" stroke="none">1</text><rect x="652.5" y="123.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="700" y="151" font-size="18" text-anchor="middle" stroke="none">0</text><text x="150" y="251" font-size="18" text-anchor="middle" stroke="none">合并后</text><rect x="292.5" y="223.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="340" y="251" font-size="18" text-anchor="middle" stroke="none">0</text><rect x="412.5" y="223.0" width="95" height="44" fill="#f0f0f0" stroke-width="2.5"/><text x="460" y="251" font-size="18" text-anchor="middle" stroke="none">2</text><rect x="532.5" y="223.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="580" y="251" font-size="18" text-anchor="middle" stroke="none">1</text><rect x="652.5" y="223.0" width="95" height="44" fill="white" stroke-width="1.4"/><text x="700" y="251" font-size="18" text-anchor="middle" stroke="none">1</text><text x="65" y="153" font-size="26" text-anchor="middle" stroke="none">+</text><path d="M75,195 L825,195" fill="none"/><text x="340" y="303" font-size="16" text-anchor="middle" stroke="none">值 1</text><text x="460" y="303" font-size="16" text-anchor="middle" stroke="none">值 2</text><text x="580" y="303" font-size="16" text-anchor="middle" stroke="none">值 3</text><text x="700" y="303" font-size="16" text-anchor="middle" stroke="none">值 4</text></g></svg>
