<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc"><title id="title">值域上的频次</title><desc id="desc">每个叶子维护一个值的出现次数。重复的三计数为二，第三小仍然是三。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222222" stroke="#222222" stroke-width="1.4"><rect x="330.0" y="27.0" width="220" height="46" fill="#f0f0f0" stroke-width="2.5"/><text x="440" y="56" font-size="18" text-anchor="middle" stroke="none">总次数 = 4</text><path d="M440,73 L230,125" fill="none"/><path d="M440,73 L650,125" fill="none"/><rect x="120.0" y="127.0" width="220" height="46" fill="#f0f0f0" stroke-width="2.5"/><text x="230" y="156" font-size="18" text-anchor="middle" stroke="none">值域 [1,3]：3</text><rect x="540.0" y="127.0" width="220" height="46" fill="white" stroke-width="1.4"/><text x="650" y="156" font-size="18" text-anchor="middle" stroke="none">值域 [5,7]：1</text><path d="M230,173 L120,220" fill="none"/><rect x="55.0" y="222.0" width="130" height="46" fill="white" stroke-width="1.4"/><text x="120" y="251" font-size="18" text-anchor="middle" stroke="none">值 1：1</text><path d="M230,173 L340,220" fill="none"/><rect x="275.0" y="222.0" width="130" height="46" fill="#f0f0f0" stroke-width="2.5"/><text x="340" y="251" font-size="18" text-anchor="middle" stroke="none">值 3：2</text><path d="M650,173 L540,220" fill="none"/><rect x="475.0" y="222.0" width="130" height="46" fill="white" stroke-width="1.4"/><text x="540" y="251" font-size="18" text-anchor="middle" stroke="none">值 5：0</text><path d="M650,173 L760,220" fill="none"/><rect x="695.0" y="222.0" width="130" height="46" fill="white" stroke-width="1.4"/><text x="760" y="251" font-size="18" text-anchor="middle" stroke="none">值 7：1</text><text x="440" y="310" font-size="16" text-anchor="middle" stroke="none">k = 3 ≤ 左侧次数 3，进入左边；再扣除值 1 的一次出现</text></g></svg>
