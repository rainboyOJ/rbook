<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="title desc"><title id="title">扫描线把面积分成横带</title><desc id="desc">矩形零零三二和一一四三并集分成三个单位高度横带，长度三四三，面积十。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222222" stroke="#222222" stroke-width="1.4"><path d="M100,295 L400,295" fill="none"/><path d="M100,295 L100,55" fill="none"/><rect x="100" y="155" width="210" height="140" fill="#f4f4f4"/><rect x="170" y="85" width="210" height="140" fill="none"/><rect x="170" y="155" width="140" height="70" fill="#dddddd" stroke="none"/><text x="100" y="320" font-size="16" text-anchor="middle" stroke="none">0</text><text x="170" y="320" font-size="16" text-anchor="middle" stroke="none">1</text><text x="240" y="320" font-size="16" text-anchor="middle" stroke="none">2</text><text x="310" y="320" font-size="16" text-anchor="middle" stroke="none">3</text><text x="380" y="320" font-size="16" text-anchor="middle" stroke="none">4</text><text x="72" y="301" font-size="16" text-anchor="middle" stroke="none">0</text><text x="72" y="231" font-size="16" text-anchor="middle" stroke="none">1</text><text x="72" y="161" font-size="16" text-anchor="middle" stroke="none">2</text><text x="72" y="91" font-size="16" text-anchor="middle" stroke="none">3</text><path d="M95,155 L400,155" fill="none" stroke-dasharray="5 5"/><path d="M95,225 L400,225" fill="none" stroke-dasharray="5 5"/><text x="235" y="36" font-size="17" text-anchor="middle" stroke="none">横向覆盖长度在事件之间不变</text><text x="520" y="85" font-size="18" text-anchor="middle" stroke="none">高度带</text><text x="650" y="85" font-size="18" text-anchor="middle" stroke="none">覆盖长度</text><text x="770" y="85" font-size="18" text-anchor="middle" stroke="none">面积</text><path d="M470,103 L820,103" fill="none"/><text x="520" y="145" font-size="18" text-anchor="middle" stroke="none">[0,1)</text><text x="650" y="145" font-size="18" text-anchor="middle" stroke="none">3</text><text x="770" y="145" font-size="18" text-anchor="middle" stroke="none">3</text><text x="520" y="200" font-size="18" text-anchor="middle" stroke="none">[1,2)</text><text x="650" y="200" font-size="18" text-anchor="middle" stroke="none">4</text><text x="770" y="200" font-size="18" text-anchor="middle" stroke="none">4</text><text x="520" y="255" font-size="18" text-anchor="middle" stroke="none">[2,3)</text><text x="650" y="255" font-size="18" text-anchor="middle" stroke="none">3</text><text x="770" y="255" font-size="18" text-anchor="middle" stroke="none">3</text><text x="640" y="310" font-size="18" text-anchor="middle" stroke="none">面积并 = 3 + 4 + 3 = 10</text></g></svg>
