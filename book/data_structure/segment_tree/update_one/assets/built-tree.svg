<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">建树完成后的线段树</title>
<desc id="desc">数组 1 -2 3 4 5 建立后的线段树，每个节点标注区间、编号与区间和。</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#222222" stroke="#222222" stroke-width="1.4">
<path d="M500,63 L280,97" fill="none"/>
<path d="M500,63 L720,97" fill="none"/>
<path d="M280,143 L170,177" fill="none"/>
<path d="M280,143 L390,177" fill="none"/>
<path d="M720,143 L610,177" fill="none"/>
<path d="M720,143 L830,177" fill="none"/>
<path d="M170,223 L90,257" fill="none"/>
<path d="M170,223 L250,257" fill="none"/>
<rect x="430.0" y="17.0" width="140" height="46" fill="#ffffff" stroke-width="1.6"/>
<text x="500" y="36" font-size="15" text-anchor="middle" stroke="none">[1,5] p=1</text>
<text x="500" y="54" font-size="15" text-anchor="middle" stroke="none">sum=11</text>
<rect x="210.0" y="97.0" width="140" height="46" fill="#ffffff" stroke-width="1.6"/>
<text x="280" y="116" font-size="15" text-anchor="middle" stroke="none">[1,3] p=2</text>
<text x="280" y="134" font-size="15" text-anchor="middle" stroke="none">sum=2</text>
<rect x="650.0" y="97.0" width="140" height="46" fill="#ffffff" stroke-width="1.6"/>
<text x="720" y="116" font-size="15" text-anchor="middle" stroke="none">[4,5] p=3</text>
<text x="720" y="134" font-size="15" text-anchor="middle" stroke="none">sum=9</text>
<rect x="100.0" y="177.0" width="140" height="46" fill="#ffffff" stroke-width="1.6"/>
<text x="170" y="196" font-size="15" text-anchor="middle" stroke="none">[1,2] p=4</text>
<text x="170" y="214" font-size="15" text-anchor="middle" stroke="none">sum=-1</text>
<rect x="320.0" y="177.0" width="140" height="46" fill="#f0f0f0" stroke-width="1.6"/>
<text x="390" y="196" font-size="15" text-anchor="middle" stroke="none">[3,3] p=5</text>
<text x="390" y="214" font-size="15" text-anchor="middle" stroke="none">sum=3</text>
<rect x="540.0" y="177.0" width="140" height="46" fill="#f0f0f0" stroke-width="1.6"/>
<text x="610" y="196" font-size="15" text-anchor="middle" stroke="none">[4,4] p=6</text>
<text x="610" y="214" font-size="15" text-anchor="middle" stroke="none">sum=4</text>
<rect x="760.0" y="177.0" width="140" height="46" fill="#f0f0f0" stroke-width="1.6"/>
<text x="830" y="196" font-size="15" text-anchor="middle" stroke="none">[5,5] p=7</text>
<text x="830" y="214" font-size="15" text-anchor="middle" stroke="none">sum=5</text>
<rect x="20.0" y="257.0" width="140" height="46" fill="#f0f0f0" stroke-width="1.6"/>
<text x="90" y="276" font-size="15" text-anchor="middle" stroke="none">[1,1] p=8</text>
<text x="90" y="294" font-size="15" text-anchor="middle" stroke="none">sum=1</text>
<rect x="180.0" y="257.0" width="140" height="46" fill="#f0f0f0" stroke-width="1.6"/>
<text x="250" y="276" font-size="15" text-anchor="middle" stroke="none">[2,2] p=9</text>
<text x="250" y="294" font-size="15" text-anchor="middle" stroke="none">sum=-2</text>
</g>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#444444">
<text x="500" y="345" text-anchor="middle">原数组 a = [1, -2, 3, 4, 5]，根节点 sum=11 为全部元素之和</text>
<text x="500" y="372" text-anchor="middle">每个内部节点的值等于两个孩子之和，灰色为叶子（原数组元素）</text>
</g>
</svg>
