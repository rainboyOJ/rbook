<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc"><title id="title">线段树向下查找</title><desc id="desc">寻找首个小于五的位置，按左优先顺序进入，最小值至少五的整段直接排除。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222222" stroke="#222222" stroke-width="1.4"><path d="M440,70 L235,115" fill="none"/><path d="M440,70 L660,115" fill="none" stroke-dasharray="5 5"/><path d="M235,165 L120,215" fill="none"/><path d="M235,165 L350,215" fill="none"/><rect x="337.5" y="20.0" width="205" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="440" y="51" font-size="18" text-anchor="middle" stroke="none">[1,8] min=3</text><rect x="132.5" y="115.0" width="205" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="235" y="146" font-size="18" text-anchor="middle" stroke="none">[1,4] min=4</text><rect x="557.5" y="115.0" width="205" height="50" fill="white" stroke-width="1.4"/><text x="660" y="146" font-size="18" text-anchor="middle" stroke="none">[5,8] 未访问</text><rect x="17.5" y="215.0" width="205" height="50" fill="white" stroke-width="1.4"/><text x="120" y="246" font-size="18" text-anchor="middle" stroke="none">[1,2] min=5</text><rect x="247.5" y="215.0" width="205" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="350" y="246" font-size="18" text-anchor="middle" stroke="none">[3,4] min=4</text><text x="120" y="300" font-size="16" text-anchor="middle" stroke="none">min ≥ 5，剪枝</text><text x="430" y="300" font-size="16" text-anchor="middle" stroke="none">继续先查左边，最终找到位置 4</text></g></svg>
