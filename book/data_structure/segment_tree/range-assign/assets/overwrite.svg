<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="title desc"><title id="title">赋值覆盖原值且零也有效</title><desc id="desc">连续两次赋值，后一次覆盖中间位置，最终数组为七零零七。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222222" stroke="#222222" stroke-width="1.4"><text x="440" y="32" font-size="18" text-anchor="middle" stroke="none">初始 [1,2,3,4]；先整段赋值 7，再把中间两项赋值 0</text><text x="180" y="105" font-size="18" text-anchor="middle" stroke="none">第一次：整段覆盖</text><rect x="310.0" y="79.0" width="80" height="42" fill="white" stroke-width="1.4"/><text x="350" y="106" font-size="18" text-anchor="middle" stroke="none">7</text><rect x="410.0" y="79.0" width="80" height="42" fill="white" stroke-width="1.4"/><text x="450" y="106" font-size="18" text-anchor="middle" stroke="none">7</text><rect x="510.0" y="79.0" width="80" height="42" fill="white" stroke-width="1.4"/><text x="550" y="106" font-size="18" text-anchor="middle" stroke="none">7</text><rect x="610.0" y="79.0" width="80" height="42" fill="white" stroke-width="1.4"/><text x="650" y="106" font-size="18" text-anchor="middle" stroke="none">7</text><text x="540" y="148" font-size="16" text-anchor="middle" stroke="none">区间和 = 28</text><text x="180" y="220" font-size="18" text-anchor="middle" stroke="none">第二次：局部覆盖</text><rect x="310.0" y="194.0" width="80" height="42" fill="white" stroke-width="1.4"/><text x="350" y="221" font-size="18" text-anchor="middle" stroke="none">7</text><rect x="410.0" y="194.0" width="80" height="42" fill="#f0f0f0" stroke-width="2.5"/><text x="450" y="221" font-size="18" text-anchor="middle" stroke="none">0</text><rect x="510.0" y="194.0" width="80" height="42" fill="#f0f0f0" stroke-width="2.5"/><text x="550" y="221" font-size="18" text-anchor="middle" stroke="none">0</text><rect x="610.0" y="194.0" width="80" height="42" fill="white" stroke-width="1.4"/><text x="650" y="221" font-size="18" text-anchor="middle" stroke="none">7</text><text x="540" y="263" font-size="16" text-anchor="middle" stroke="none">区间和 = 14</text></g></svg>
