<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="title desc"><title id="title">变换不交换</title><desc id="desc">同一个数先加三再乘二，与先乘二再加三，常数项不同。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222222" stroke="#222222" stroke-width="1.4"><rect x="45.0" y="55.0" width="190" height="50" fill="white" stroke-width="1.4"/><text x="140" y="86" font-size="18" text-anchor="middle" stroke="none">x</text><rect x="345.0" y="55.0" width="190" height="50" fill="white" stroke-width="1.4"/><text x="440" y="86" font-size="18" text-anchor="middle" stroke="none">x + 3</text><rect x="645.0" y="55.0" width="190" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="740" y="86" font-size="18" text-anchor="middle" stroke="none">2x + 6</text><path d="M235,80 L345,80" fill="none"/><path d="M535,80 L645,80" fill="none"/><text x="290" y="62" font-size="16" text-anchor="middle" stroke="none">加 3</text><text x="590" y="62" font-size="16" text-anchor="middle" stroke="none">乘 2</text><rect x="45.0" y="175.0" width="190" height="50" fill="white" stroke-width="1.4"/><text x="140" y="206" font-size="18" text-anchor="middle" stroke="none">x</text><rect x="345.0" y="175.0" width="190" height="50" fill="white" stroke-width="1.4"/><text x="440" y="206" font-size="18" text-anchor="middle" stroke="none">2x</text><rect x="645.0" y="175.0" width="190" height="50" fill="#f0f0f0" stroke-width="2.5"/><text x="740" y="206" font-size="18" text-anchor="middle" stroke="none">2x + 3</text><path d="M235,200 L345,200" fill="none"/><path d="M535,200 L645,200" fill="none"/><text x="290" y="182" font-size="16" text-anchor="middle" stroke="none">乘 2</text><text x="590" y="182" font-size="16" text-anchor="middle" stroke="none">加 3</text></g></svg>
