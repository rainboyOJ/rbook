<svg xmlns="http://www.w3.org/2000/svg" width="760" height="495" viewBox="0 0 760 495" role="img" aria-labelledby="title desc">
<title id="title">插入新节点时调整最右侧路径</title><desc id="desc">插入前的最右路径为节点二、三、四。插入节点五，权值二，弹出四和三。节点二的右孩子改为五，五的左孩子设为三；三的右孩子四保持不变。</desc>
<rect width="760" height="495" fill="white"/>
<text x="185" y="30" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">插入前：下标 1..4</text>
<text x="575" y="30" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">插入后：下标 1..5</text>
<rect x="210" y="140" width="135" height="170" fill="#f4f4f4" stroke="#777" stroke-dasharray="5 5"/>
<rect x="525" y="240" width="140" height="170" fill="#f4f4f4" stroke="#777" stroke-dasharray="5 5"/>
<path d="M109.651 104.734L70.3485 155.266" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M145 100L225 160" fill="none" stroke="#222" stroke-width="2.4"/>
<path d="M258.625 195.961L296.375 254.039" fill="none" stroke="#222" stroke-width="2.4"/>
<path d="M474.651 104.734L435.349 155.266" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M512.593 95.7022L657.407 164.298" fill="none" stroke="#222" stroke-width="2.4"/>
<path d="M660.794 191.005L579.206 258.995" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M574.337 295.481L615.663 354.519" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="55" cy="175" r="25" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="55" y="181" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">1:3</text>
<circle cx="125" cy="85" r="25" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="125" y="91" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">2:1</text>
<circle cx="245" cy="175" r="25" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="245" y="181" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">3:4</text>
<circle cx="310" cy="275" r="25" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="310" y="281" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">4:5</text>
<circle cx="420" cy="175" r="25" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="420" y="181" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">1:3</text>
<circle cx="490" cy="85" r="25" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="490" y="91" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">2:1</text>
<circle cx="560" cy="275" r="25" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="560" y="281" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">3:4</text>
<circle cx="630" cy="375" r="25" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="630" y="381" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">4:5</text>
<circle cx="680" cy="175" r="25" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="680" y="181" text-anchor="middle" font-family="monospace" font-size="19" fill="#222">5:2</text>
<text x="185" y="355" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">弹出 4、3，last = 3</text>
<text x="185" y="435" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">栈：[2,3,4]</text>
<text x="575" y="435" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">栈：[2,5]</text>
<text x="380" y="477" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">虚线区域：节点 3 的原子树整体保留</text>
</svg>
