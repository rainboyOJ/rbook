<svg xmlns="http://www.w3.org/2000/svg" width="810" height="365" viewBox="0 0 810 365" role="img" aria-labelledby="title desc">
<title id="title">路径压缩不改变集合归属</title><desc id="desc">查询五时沿五、四、一找到根一。压缩后五直接指向一，代表元与集合成员不变。</desc>
