<rect width="810" height="365" fill="white"/>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><text x="190" y="30" font-size="18" fill="#222" text-anchor="middle">压缩前</text><text x="610" y="30" font-size="18" fill="#222" text-anchor="middle">find(5) 之后</text><line x1="77.36" y1="173.43" x2="150.47" y2="103.64" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="170.00" y1="166.00" x2="170.00" y2="112.00" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="262.64" y1="173.43" x2="189.53" y2="103.64" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="280.00" y1="261.00" x2="280.00" y2="217.00" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="170" cy="85" r="23" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="170" cy="85" r="19" fill="none" stroke="#222" stroke-width="1"/><text x="170" y="92" font-size="21" fill="#222" text-anchor="middle">1</text><circle cx="60" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="60" y="197" font-size="21" fill="#222" text-anchor="middle">2</text><circle cx="170" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="170" y="197" font-size="21" fill="#222" text-anchor="middle">3</text><circle cx="280" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="280" y="197" font-size="21" fill="#222" text-anchor="middle">4</text><circle cx="280" cy="285" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="280" y="292" font-size="21" fill="#222" text-anchor="middle">5</text><line x1="479.66" y1="176.24" x2="587.88" y2="100.48" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="570.32" y1="168.33" x2="598.39" y2="109.38" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="649.68" y1="168.33" x2="621.61" y2="109.38" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="740.34" y1="176.24" x2="632.12" y2="100.48" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="610" cy="85" r="23" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="610" cy="85" r="19" fill="none" stroke="#222" stroke-width="1"/><text x="610" y="92" font-size="21" fill="#222" text-anchor="middle">1</text><circle cx="460" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="460" y="197" font-size="21" fill="#222" text-anchor="middle">2</text><circle cx="560" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="560" y="197" font-size="21" fill="#222" text-anchor="middle">3</text><circle cx="660" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="660" y="197" font-size="21" fill="#222" text-anchor="middle">4</text><circle cx="760" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="760" y="197" font-size="21" fill="#222" text-anchor="middle">5</text><path d="M 380 160 H 410" fill="none" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)"/><text x="190" y="340" font-size="18" fill="#222" text-anchor="middle">查找路径：5 → 4 → 1</text><text x="610" y="340" font-size="18" fill="#222" text-anchor="middle">fa[5] = 1，集合成员不变</text></g>
