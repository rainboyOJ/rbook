<svg xmlns="http://www.w3.org/2000/svg" width="640" height="325" viewBox="0 0 640 325" role="img" aria-labelledby="title desc"><title id="title">食物链中的三组对应身份</title><desc id="desc">当 x 吃 y，x 自身对应 y 的天敌，x 的猎物对应 y 自身，x 的天敌对应 y 的猎物，形成三组同类合并。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#222"/></marker></defs><rect width="640" height="325" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><line x1="188" y1="55" x2="442" y2="55" stroke="#222" stroke-width="1.4"/><text x="315" y="43" font-size="17" text-anchor="middle" fill="#222">同类</text><rect x="52.0" y="33.0" width="136" height="44" fill="white" stroke="#222" stroke-width="1.4"/><text x="120" y="62" font-size="20" text-anchor="middle" fill="#222">x</text><rect x="442.0" y="33.0" width="136" height="44" fill="white" stroke="#222" stroke-width="1.4"/><text x="510" y="62" font-size="20" text-anchor="middle" fill="#222">y+2n</text><text x="120" y="103" font-size="17" text-anchor="middle" fill="#222">x 自身</text><text x="510" y="103" font-size="17" text-anchor="middle" fill="#222">y 的天敌</text><line x1="188" y1="155" x2="442" y2="155" stroke="#222" stroke-width="1.4"/><text x="315" y="143" font-size="17" text-anchor="middle" fill="#222">同类</text><rect x="52.0" y="133.0" width="136" height="44" fill="white" stroke="#222" stroke-width="1.4"/><text x="120" y="162" font-size="20" text-anchor="middle" fill="#222">x+n</text><rect x="442.0" y="133.0" width="136" height="44" fill="white" stroke="#222" stroke-width="1.4"/><text x="510" y="162" font-size="20" text-anchor="middle" fill="#222">y</text><text x="120" y="203" font-size="17" text-anchor="middle" fill="#222">x 的猎物</text><text x="510" y="203" font-size="17" text-anchor="middle" fill="#222">y 自身</text><line x1="188" y1="255" x2="442" y2="255" stroke="#222" stroke-width="1.4"/><text x="315" y="243" font-size="17" text-anchor="middle" fill="#222">同类</text><rect x="52.0" y="233.0" width="136" height="44" fill="white" stroke="#222" stroke-width="1.4"/><text x="120" y="262" font-size="20" text-anchor="middle" fill="#222">x+2n</text><rect x="442.0" y="233.0" width="136" height="44" fill="white" stroke="#222" stroke-width="1.4"/><text x="510" y="262" font-size="20" text-anchor="middle" fill="#222">y+n</text><text x="120" y="303" font-size="17" text-anchor="middle" fill="#222">x 的天敌</text><text x="510" y="303" font-size="17" text-anchor="middle" fill="#222">y 的猎物</text></g></svg>
