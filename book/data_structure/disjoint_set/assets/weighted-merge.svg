<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-labelledby="title desc"><title id="title">差值约束决定根间边权</title><desc id="desc">将 fy 接到 fx，需要 d[fy]=4+3-(-1)=8。此时 y 相对 x 的差为负一加八减三，等于四。实线是父亲指针，虚线仅表示输入约束。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#222"/></marker></defs><rect width="620" height="360" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><line x1="130.0" y1="224.0" x2="130.0" y2="114.0" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="480.0" y1="224.0" x2="480.0" y2="114.0" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="454.0" y1="85.0" x2="159.0" y2="85.0" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/><text x="305" y="60" font-size="18" text-anchor="middle" fill="#222">d[fy] = 8</text><text x="205" y="175" font-size="18" text-anchor="middle" fill="#222">d[x] = 3</text><text x="405" y="175" font-size="18" text-anchor="middle" fill="#222">d[y] = −1</text><line x1="158" y1="250" x2="452" y2="250" stroke="#222" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="305" y="285" font-size="18" text-anchor="middle" fill="#222">V[y] − V[x] = 4</text><circle cx="130" cy="85" r="25" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="130" cy="85" r="21" fill="none" stroke="#222"/><text x="130" y="92" font-size="21" text-anchor="middle" fill="#222">fx</text><circle cx="480" cy="85" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="480" y="92" font-size="21" text-anchor="middle" fill="#222">fy</text><circle cx="130" cy="250" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="130" y="257" font-size="21" text-anchor="middle" fill="#222">x</text><circle cx="480" cy="250" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="480" y="257" font-size="21" text-anchor="middle" fill="#222">y</text><text x="305" y="335" font-size="17" text-anchor="middle" fill="#222">实线：父亲指针；虚线：新加入的差值约束</text></g></svg>
