<svg xmlns="http://www.w3.org/2000/svg" width="810" height="365" viewBox="0 0 810 365" role="img" aria-labelledby="title desc">
<title id="title">合并时只连接两个根</title><desc id="desc">合并二和五所在的集合，将根四指向根一。五的父亲仍为四，通过四到达新根一。粗线是新改的父亲指针。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#222"/></marker></defs>
<rect width="810" height="365" fill="white"/>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><text x="190" y="30" font-size="18" fill="#222" text-anchor="middle">合并前：两个集合</text><text x="610" y="30" font-size="18" fill="#222" text-anchor="middle">合并后：一个集合</text><line x1="69.55" y1="170.91" x2="118.64" y2="106.48" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="166.46" y1="167.57" x2="144.61" y2="110.23" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="305.00" y1="261.00" x2="305.00" y2="112.00" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><circle cx="135" cy="85" r="23" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="135" cy="85" r="19" fill="none" stroke="#222" stroke-width="1"/><text x="135" y="92" font-size="21" fill="#222" text-anchor="middle">1</text><circle cx="55" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="55" y="197" font-size="21" fill="#222" text-anchor="middle">2</text><circle cx="175" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="175" y="197" font-size="21" fill="#222" text-anchor="middle">3</text><circle cx="305" cy="85" r="23" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="305" cy="85" r="19" fill="none" stroke="#222" stroke-width="1"/><text x="305" y="92" font-size="21" fill="#222" text-anchor="middle">4</text><circle cx="305" cy="285" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="305" y="292" font-size="21" fill="#222" text-anchor="middle">5</text><line x1="489.55" y1="170.91" x2="538.64" y2="106.48" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="586.46" y1="167.57" x2="564.61" y2="110.23" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="704.58" y1="177.39" x2="577.97" y2="99.19" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="725.00" y1="261.00" x2="725.00" y2="217.00" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><circle cx="555" cy="85" r="23" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="555" cy="85" r="19" fill="none" stroke="#222" stroke-width="1"/><text x="555" y="92" font-size="21" fill="#222" text-anchor="middle">1</text><circle cx="475" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="475" y="197" font-size="21" fill="#222" text-anchor="middle">2</text><circle cx="595" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="595" y="197" font-size="21" fill="#222" text-anchor="middle">3</text><circle cx="725" cy="190" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="725" y="197" font-size="21" fill="#222" text-anchor="middle">4</text><circle cx="725" cy="285" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="725" y="292" font-size="21" fill="#222" text-anchor="middle">5</text><path d="M 380 160 H 410" fill="none" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)"/><text x="190" y="340" font-size="18" fill="#222" text-anchor="middle">find(2) = 1，find(5) = 4</text><text x="610" y="340" font-size="18" fill="#222" text-anchor="middle">fa[4] = 1；fa[5] 仍为 4</text></g>
</svg>
