<svg xmlns="http://www.w3.org/2000/svg" width="640" height="315" viewBox="0 0 640 315" role="img" aria-labelledby="title desc"><title id="title">两次异类推出同类</title><desc id="desc">一和二异类，二和三异类，得到一、二的反面、三为同组；另一组为一的反面、二、三的反面。一与三已经同类，新增异类约束被拒绝。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#222"/></marker></defs><rect width="640" height="315" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><text x="300" y="27" font-size="18" text-anchor="middle" fill="#222">新增“1、3 异类”：拒绝</text><path d="M 111 80 Q 260 5 409 80" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="136" y1="105" x2="384" y2="105" stroke="#222" stroke-width="1.4"/><circle cx="110" cy="105" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="110" y="112" font-size="21" text-anchor="middle" fill="#222">1</text><circle cx="260" cy="105" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="260" y="112" font-size="21" text-anchor="middle" fill="#222">2′</text><circle cx="410" cy="105" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="410" y="112" font-size="21" text-anchor="middle" fill="#222">3</text><text x="545" y="111" font-size="17" text-anchor="middle" fill="#222">一组同类身份</text><line x1="136" y1="225" x2="384" y2="225" stroke="#222" stroke-width="1.4"/><circle cx="110" cy="225" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="110" y="232" font-size="21" text-anchor="middle" fill="#222">1′</text><circle cx="260" cy="225" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="260" y="232" font-size="21" text-anchor="middle" fill="#222">2</text><circle cx="410" cy="225" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="410" y="232" font-size="21" text-anchor="middle" fill="#222">3′</text><text x="545" y="231" font-size="17" text-anchor="middle" fill="#222">相反的一组</text><text x="300" y="290" font-size="17" text-anchor="middle" fill="#222">实线：已有同类关系；虚线：新增异类要求</text></g></svg>
