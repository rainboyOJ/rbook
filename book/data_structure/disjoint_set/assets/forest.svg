<svg xmlns="http://www.w3.org/2000/svg" width="450" height="255" viewBox="0 0 450 255" role="img" aria-labelledby="title desc">
<title id="title">用森林表示两个不相交集合</title><desc id="desc">双圆表示根，箭头从孩子指向父亲。二和三指向一，五指向四。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#222"/></marker></defs>
<rect width="450" height="255" fill="white"/>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><line x1="93.31" y1="160.03" x2="135.02" y2="97.47" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="206.69" y1="160.03" x2="164.98" y2="97.47" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="350.00" y1="156.00" x2="350.00" y2="102.00" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><circle cx="150" cy="75" r="23" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="150" cy="75" r="19" fill="none" stroke="#222" stroke-width="1"/><text x="150" y="82" font-size="21" fill="#222" text-anchor="middle">1</text><circle cx="80" cy="180" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="80" y="187" font-size="21" fill="#222" text-anchor="middle">2</text><circle cx="220" cy="180" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="220" y="187" font-size="21" fill="#222" text-anchor="middle">3</text><circle cx="350" cy="75" r="23" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="350" cy="75" r="19" fill="none" stroke="#222" stroke-width="1"/><text x="350" y="82" font-size="21" fill="#222" text-anchor="middle">4</text><circle cx="350" cy="180" r="23" fill="white" stroke="#222" stroke-width="1.5"/><text x="350" y="187" font-size="21" fill="#222" text-anchor="middle">5</text><text x="150" y="235" font-size="18" fill="#222" text-anchor="middle">{1, 2, 3}</text><text x="350" y="235" font-size="18" fill="#222" text-anchor="middle">{4, 5}</text></g>
</svg>
