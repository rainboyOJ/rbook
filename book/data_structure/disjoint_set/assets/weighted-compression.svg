<svg xmlns="http://www.w3.org/2000/svg" width="810" height="275" viewBox="0 0 810 275" role="img" aria-labelledby="title desc"><title id="title">带权路径压缩累加父亲边权</title><desc id="desc">压缩前 x 到父亲 p 的差为二，p 到根 r 的差为五；压缩后 x 直接指向 r，差改为七。p 到 r 的差仍为五。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#222"/></marker></defs><rect width="810" height="275" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><text x="205" y="30" font-size="18" text-anchor="middle" fill="#222">压缩前</text><text x="610" y="30" font-size="18" text-anchor="middle" fill="#222">find(x) 之后</text><line x1="116.0" y1="180.0" x2="181.0" y2="180.0" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="236.0" y1="180.0" x2="301.0" y2="180.0" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><text x="150" y="155" font-size="18" text-anchor="middle" fill="#222">2</text><text x="270" y="155" font-size="18" text-anchor="middle" fill="#222">5</text><line x1="636.0" y1="180.0" x2="701.0" y2="180.0" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><text x="670" y="155" font-size="18" text-anchor="middle" fill="#222">5</text><path d="M 505 160 Q 610 50 715 160" fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/><text x="610" y="85" font-size="18" text-anchor="middle" fill="#222">2 + 5 = 7</text><circle cx="90" cy="180" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="90" y="187" font-size="21" text-anchor="middle" fill="#222">x</text><circle cx="210" cy="180" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="210" y="187" font-size="21" text-anchor="middle" fill="#222">p</text><circle cx="330" cy="180" r="25" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="330" cy="180" r="21" fill="none" stroke="#222"/><text x="330" y="187" font-size="21" text-anchor="middle" fill="#222">r</text><circle cx="490" cy="180" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="490" y="187" font-size="21" text-anchor="middle" fill="#222">x</text><circle cx="610" cy="180" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="610" y="187" font-size="21" text-anchor="middle" fill="#222">p</text><circle cx="730" cy="180" r="25" fill="white" stroke="#222" stroke-width="1.5"/><circle cx="730" cy="180" r="21" fill="none" stroke="#222"/><text x="730" y="187" font-size="21" text-anchor="middle" fill="#222">r</text><line x1="380" y1="180" x2="430" y2="180" stroke="#222" stroke-width="1.4" marker-end="url(#arrow)"/><text x="405" y="245" font-size="17" text-anchor="middle" fill="#222">箭头指向父亲，边上记录“自身减父亲”的差</text></g></svg>
