<svg xmlns="http://www.w3.org/2000/svg" width="560" height="255" viewBox="0 0 560 255" role="img" aria-labelledby="title desc"><title id="title">二类关系的交叉合并</title><desc id="desc">x 与 y 异类时，x 与 y 的相反身份同类，x 的相反身份与 y 同类。实线连接需要合并的身份，不表示具体父亲指针。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#222"/></marker></defs><rect width="560" height="255" fill="white"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif"><line x1="156" y1="65" x2="404" y2="65" stroke="#222" stroke-width="1.4"/><text x="280" y="52" font-size="18" text-anchor="middle" fill="#222">同类</text><circle cx="130" cy="65" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="130" y="72" font-size="21" text-anchor="middle" fill="#222">x</text><circle cx="430" cy="65" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="430" y="72" font-size="21" text-anchor="middle" fill="#222">y′</text><text x="130" y="113" font-size="17" text-anchor="middle" fill="#222">自身</text><text x="430" y="113" font-size="17" text-anchor="middle" fill="#222">y 的相反身份</text><line x1="156" y1="185" x2="404" y2="185" stroke="#222" stroke-width="1.4"/><text x="280" y="172" font-size="18" text-anchor="middle" fill="#222">同类</text><circle cx="130" cy="185" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="130" y="192" font-size="21" text-anchor="middle" fill="#222">x′</text><circle cx="430" cy="185" r="25" fill="white" stroke="#222" stroke-width="1.5"/><text x="430" y="192" font-size="21" text-anchor="middle" fill="#222">y</text><text x="130" y="233" font-size="17" text-anchor="middle" fill="#222">x 的相反身份</text><text x="430" y="233" font-size="17" text-anchor="middle" fill="#222">自身</text></g></svg>
