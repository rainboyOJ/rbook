<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">双向 BFS 的两侧前沿</title>
  <desc id="desc">原图从 S 经 A、C 到 T，或经 B、D 到 T。正向发现 A、B，反向沿反图发现 C、D，再扩展一层即可连接。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7" fill="none" stroke="#222"/></marker></defs>
  <rect width="760" height="330" fill="white"/>
  <g fill="#f4f4f4" stroke="#777" stroke-dasharray="5 5"><rect x="208" y="35" width="84" height="227"/><rect x="438" y="35" width="84" height="227"/></g>
  <g stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M101 145L227 90"/><path d="M101 165L227 220"/>
    <path d="M274 80H455"/><path d="M274 230H455"/>
    <path d="M503 90L629 145"/><path d="M503 220L629 165"/>
  </g>
  <g fill="white" stroke="#222" stroke-width="1.5"><circle cx="80" cy="155" r="24"/><circle cx="250" cy="80" r="24"/><circle cx="250" cy="230" r="24"/><circle cx="480" cy="80" r="24"/><circle cx="480" cy="230" r="24"/><circle cx="650" cy="155" r="24"/></g>
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#222" text-anchor="middle"><text x="80" y="162">S</text><text x="250" y="87">A</text><text x="250" y="237">B</text><text x="480" y="87">C</text><text x="480" y="237">D</text><text x="650" y="162">T</text></g>
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#222" text-anchor="middle"><text x="250" y="295">正向第 1 层</text><text x="480" y="295">反向第 1 层</text><text x="365" y="135">再扩展一层</text><text x="365" y="160">2 + 1 = 3</text><text x="80" y="202">起点</text><text x="650" y="202">终点</text></g>
</svg>
