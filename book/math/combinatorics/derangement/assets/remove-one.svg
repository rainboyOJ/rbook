<svg xmlns="http://www.w3.org/2000/svg" width="760" height="355" viewBox="0 0 760 355" role="img" aria-labelledby="title desc">
<title id="title">删去错排环中的一个元素</title><desc id="desc">左图是错排一到二、二到三、三到四、四到一。删除元素一，并将四到一到二的路径接成四到二，得到元素二、三、四的错排。</desc>
<rect width="760" height="355" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs>
<text x="190" y="32" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#222">删除前：4 个元素</text>
<text x="570" y="32" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#222">删除后：3 个元素</text>
<path d="M124 100L252 100" fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M280 124L280 222" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M256 250L128 250" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M100 226L100 128" fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M583.763 119.662L658.943 227.062" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M651 250L493 250" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M478.763 230.338L553.943 122.938" fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="100" cy="100" r="24" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="100" y="107" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">1</text>
<circle cx="280" cy="100" r="24" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="280" y="107" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">2</text>
<circle cx="280" cy="250" r="24" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="280" y="257" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">3</text>
<circle cx="100" cy="250" r="24" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="100" y="257" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">4</text>
<circle cx="570" cy="100" r="24" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="570" y="107" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">2</text>
<circle cx="675" cy="250" r="24" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="675" y="257" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">3</text>
<circle cx="465" cy="250" r="24" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="465" y="257" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">4</text>
<text x="380" y="331" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#222">把 4 → 1 → 2 重新连接为 4 → 2</text>
</svg>
