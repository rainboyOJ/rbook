<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">同余前缀构造连续段</title><desc id="desc">数组为二、四、一、三、六，长度五。包含空前缀的六个前缀和为零、二、六、七、十、十六，模五余数为零、二、一、二、零、一。位置一和三的前缀余数相同，因此区间二到三的和为五。</desc>
<rect width="760" height="350" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs>
<text x="380" y="30" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#222">n = 5：6 个前缀，5 种余数</text>
<rect x="140" y="60" width="100" height="45" fill="white" stroke="#777"/>
<text x="190" y="90" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">2</text>
<rect x="240" y="60" width="100" height="45" fill="#f4f4f4" stroke="#777"/>
<text x="290" y="90" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">4</text>
<rect x="340" y="60" width="100" height="45" fill="#f4f4f4" stroke="#777"/>
<text x="390" y="90" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">1</text>
<rect x="440" y="60" width="100" height="45" fill="white" stroke="#777"/>
<text x="490" y="90" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">3</text>
<rect x="540" y="60" width="100" height="45" fill="white" stroke="#777"/>
<text x="590" y="90" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">6</text>
<text x="75" y="90" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">数组 a</text>
<text x="75" y="145" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">位置 i</text>
<text x="75" y="190" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">前缀 P</text>
<text x="75" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">余数</text>
<text x="140" y="145" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">0</text>
<text x="140" y="190" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">0</text>
<text x="140" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">0</text>
<text x="240" y="145" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">1</text>
<text x="240" y="190" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">2</text>
<circle cx="240" cy="235" r="22" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="240" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">2</text>
<text x="340" y="145" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">2</text>
<text x="340" y="190" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">6</text>
<text x="340" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">1</text>
<text x="440" y="145" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">3</text>
<text x="440" y="190" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">7</text>
<circle cx="440" cy="235" r="22" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="440" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">2</text>
<text x="540" y="145" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">4</text>
<text x="540" y="190" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">10</text>
<text x="540" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">0</text>
<text x="640" y="145" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#222">5</text>
<text x="640" y="190" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">16</text>
<text x="640" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#222">1</text>
<path d="M240 263V281H440V263" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="340" y="322" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#222">P₃ − P₁ = 7 − 2 = 5，得到区间 [2,3]</text>
</svg>
