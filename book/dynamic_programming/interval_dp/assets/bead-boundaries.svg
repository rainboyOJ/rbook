<svg xmlns="http://www.w3.org/2000/svg" width="760" height="285" viewBox="0 0 760 285" role="img" aria-labelledby="title desc">
  <title id="title">珠子区间与边界标记</title>
  <desc id="desc">四颗珠子的边界标记依次是 2、3、5、10、2。在第二颗珠子之后分割，两段合并得到 2、5 与 5、2，最后产生能量 2 乘 5 乘 2。</desc>
  <rect width="760" height="285" fill="white"/>
  <g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="18" fill="#222222" text-anchor="middle">
    <text x="90" y="32">a[1]</text><text x="230" y="32">a[2]</text><text x="370" y="32">a[3]</text><text x="510" y="32">a[4]</text><text x="650" y="32">a[5]</text>
    <line x1="90" y1="79" x2="650" y2="79" stroke="#777777" stroke-width="1.3"/>
    <g fill="white" stroke="#222222" stroke-width="1.4">
      <circle cx="90" cy="79" r="22"/><circle cx="230" cy="79" r="22"/><circle cx="370" cy="79" r="22"/><circle cx="510" cy="79" r="22"/><circle cx="650" cy="79" r="22"/>
    </g>
    <circle cx="370" cy="79" r="26" fill="none" stroke="#222222" stroke-width="1.3"/>
    <text x="90" y="86">2</text><text x="230" y="86">3</text><text x="370" y="86">5</text><text x="510" y="86">10</text><text x="650" y="86">2</text>
    <g font-size="16" fill="#777777">
      <text x="160" y="124">珠子 1</text><text x="300" y="124">珠子 2</text><text x="440" y="124">珠子 3</text><text x="580" y="124">珠子 4</text>
    </g>
    <path d="M90,146 V155 H360 V146 M380,146 V155 H650 V146" fill="none" stroke="#222222" stroke-width="1.3"/>
    <text x="225" y="190">左段合成 (2,5)</text><text x="515" y="190">右段合成 (5,2)</text>
    <text x="370" y="245">k = 2，最后释放 2 × 5 × 2 = 20</text>
  </g>
</svg>
