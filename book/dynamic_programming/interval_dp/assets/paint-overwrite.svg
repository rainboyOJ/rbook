<svg xmlns="http://www.w3.org/2000/svg" width="760" height="285" viewBox="0 0 760 285" role="img" aria-labelledby="title desc">
  <title id="title">三笔涂出 RGBGR</title>
  <desc id="desc">先将一到五涂为 R，再将二到四涂为 G，最后将三号涂为 B。灰底和粗边表示当前这一笔覆盖的位置。</desc>
  <rect width="760" height="285" fill="white"/>
  <g font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="18" fill="#222222">
    <g text-anchor="middle" fill="#777777" font-size="16">
      <text x="291" y="26">1</text><text x="353" y="26">2</text><text x="415" y="26">3</text><text x="477" y="26">4</text><text x="539" y="26">5</text>
    </g>
    <text x="32" y="70">第 1 笔：[1,5] 涂 R</text>
    <text x="32" y="150">第 2 笔：[2,4] 涂 G</text>
    <text x="32" y="230">第 3 笔：[3,3] 涂 B</text>
    <g stroke="#777777" stroke-width="1" fill="white">
      <path d="M260,44 H570 V86 H260 Z M260,124 H570 V166 H260 Z M260,204 H570 V246 H260 Z"/>
    </g>
    <g fill="#f4f4f4" stroke="#222222" stroke-width="2">
      <rect x="260" y="44" width="310" height="42"/>
      <rect x="322" y="124" width="186" height="42"/>
      <rect x="384" y="204" width="62" height="42"/>
    </g>
    <g stroke="#777777" stroke-width="1">
      <path d="M322,44 V86 M384,44 V86 M446,44 V86 M508,44 V86 M322,124 V166 M384,124 V166 M446,124 V166 M508,124 V166 M322,204 V246 M384,204 V246 M446,204 V246 M508,204 V246"/>
    </g>
    <g text-anchor="middle" font-size="20">
      <text x="291" y="73">R</text><text x="353" y="73">R</text><text x="415" y="73">R</text><text x="477" y="73">R</text><text x="539" y="73">R</text>
      <text x="291" y="153">R</text><text x="353" y="153">G</text><text x="415" y="153">G</text><text x="477" y="153">G</text><text x="539" y="153">R</text>
      <text x="291" y="233">R</text><text x="353" y="233">G</text><text x="415" y="233">B</text><text x="477" y="233">G</text><text x="539" y="233">R</text>
    </g>
    <text x="610" y="70" font-size="17">共用一笔</text><text x="610" y="150" font-size="17">覆盖内部</text><text x="610" y="230" font-size="17">修正中间</text>
  </g>
</svg>
