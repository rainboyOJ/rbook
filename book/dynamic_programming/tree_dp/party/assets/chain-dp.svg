<svg xmlns="http://www.w3.org/2000/svg" width="540" height="146" viewBox="0 0 540 146" role="img" aria-labelledby="title desc">
  <title id="title">链上 DP 的答案回传</title>
  <desc id="desc">从左到右为 i−1、i、i+1、i+2。箭头从右向左，强调直接下属 i+1 把答案传给当前节点 i。</desc>

  <rect x="0" y="0" width="540" height="146" fill="#F2F2F2"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#777777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="main-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#222222" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g stroke="#777777" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="173" y1="68" x2="109" y2="68"/>
    <line x1="432" y1="68" x2="368" y2="68"/>
  </g>
  <line x1="303" y1="68" x2="238" y2="68" stroke="#222222" stroke-width="2" marker-end="url(#main-arrow)"/>

  <g fill="#FFFFFF" stroke="#777777" stroke-width="1.4">
    <circle cx="76" cy="68" r="26"/>
    <circle cx="335" cy="68" r="26"/>
    <circle cx="464" cy="68" r="26"/>
  </g>
  <circle cx="205" cy="68" r="26" fill="#FFFFFF" stroke="#222222" stroke-width="2.2"/>

  <g fill="#222222" font-family="STIX Two Text, Times New Roman, serif" font-size="20" text-anchor="middle">
    <text x="76" y="75"><tspan font-style="italic">i</tspan>−1</text>
    <text x="205" y="75" font-style="italic">i</text>
    <text x="335" y="75"><tspan font-style="italic">i</tspan>+1</text>
    <text x="464" y="75"><tspan font-style="italic">i</tspan>+2</text>
  </g>
  <g fill="#222222" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" text-anchor="middle">
    <text x="270" y="48">答案回传</text>
    <text x="205" y="119">当前节点</text>
    <text x="335" y="119">直接下属</text>
  </g>
</svg>
