<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">父节点的选择决定孩子允许的状态</title>
  <desc id="desc">左图选择 u，两个孩子只能不选，但其后代仍可选择。右图不选 u，每个孩子可以独立取选或不选的较优方案。三角形表示孩子的后代。</desc>
  <rect width="760" height="310" fill="#ffffff"/>
  <g font-family="Noto Serif CJK SC, Source Han Serif SC, serif" font-size="20" fill="#222222" text-anchor="middle">
    <text x="185" y="30">选择 u</text>
    <text x="575" y="30">不选 u</text>
    <g stroke="#777777" stroke-width="1.5" fill="none">
      <path d="M185 83 L100 153 M185 83 L270 153 M575 83 L490 153 M575 83 L660 153"/>
      <path d="M100 176 L57 248 L143 248 Z M270 176 L227 248 L313 248 Z M490 176 L447 248 L533 248 Z M660 176 L617 248 L703 248 Z" fill="#f4f4f4"/>
    </g>
    <g stroke="#222222" stroke-width="1.6">
      <circle cx="185" cy="83" r="23" fill="#222222"/>
      <circle cx="575" cy="83" r="23" fill="#ffffff"/>
      <circle cx="100" cy="153" r="23" fill="#ffffff"/>
      <circle cx="270" cy="153" r="23" fill="#ffffff"/>
      <circle cx="490" cy="153" r="23" fill="#ffffff" stroke-dasharray="4 3"/>
      <circle cx="660" cy="153" r="23" fill="#ffffff" stroke-dasharray="4 3"/>
    </g>
    <text x="185" y="90" fill="#ffffff" font-style="italic">u</text>
    <text x="575" y="90" font-style="italic">u</text>
    <text x="100" y="160">v<tspan font-size="14" baseline-shift="sub">1</tspan></text>
    <text x="270" y="160">v<tspan font-size="14" baseline-shift="sub">2</tspan></text>
    <text x="490" y="160">v<tspan font-size="14" baseline-shift="sub">1</tspan></text>
    <text x="660" y="160">v<tspan font-size="14" baseline-shift="sub">2</tspan></text>
    <text x="185" y="286">每个孩子必须不选</text>
    <text x="575" y="286">每个孩子分别取较优状态</text>
  </g>
</svg>
