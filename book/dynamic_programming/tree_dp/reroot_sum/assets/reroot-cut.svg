<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">换根时边两侧的距离变化</title>
  <desc id="desc">树边为 1-2、1-3、3-4、3-5。从 1 移到 3，右侧三个点各近一步，左侧两个点各远一步。距离和由 6 变为 5。</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#222222" stroke-width="1.3"/></marker></defs>
  <g stroke="#777777" stroke-width="1.5" fill="none"><path d="M240 145 L100 255 M240 145 L480 145 L430 255 M480 145 L610 255"/><path d="M360 113 L360 295" stroke-dasharray="5 4"/></g>
  <path d="M275 91 L445 91" stroke="#222222" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <g stroke="#222222" stroke-width="1.6" fill="#ffffff"><circle cx="240" cy="145" r="24"/><circle cx="100" cy="255" r="24"/><circle cx="480" cy="145" r="24"/><circle cx="430" cy="255" r="24"/><circle cx="610" cy="255" r="24"/></g>
  <g font-family="Noto Serif CJK SC, Source Han Serif SC, serif" text-anchor="middle" fill="#222222">
    <g font-size="22"><text x="240" y="153">1</text><text x="100" y="263">2</text><text x="480" y="153">3</text><text x="430" y="263">4</text><text x="610" y="263">5</text></g>
    <g font-size="20"><text x="185" y="32">其余 2 个点</text><text x="540" y="32">3 的子树，共 3 个点</text><text x="360" y="73">根从 1 移到 3</text><text x="170" y="332">距离各加 1</text><text x="540" y="332">距离各减 1</text></g>
  </g>
</svg>
