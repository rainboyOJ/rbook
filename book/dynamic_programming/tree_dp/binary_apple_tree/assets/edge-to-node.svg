<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc">
<title id="title">父边的权值转移到孩子节点</title>
<desc id="desc">根为 1，边 1-3、1-4、3-2、3-5 的权值为 1、10、20、20。转换后点 1、3、4、2、5 的权值为 0、1、10、20、20。</desc>
<rect width="800" height="340" fill="#ffffff"/>
<text x="200" y="24" font-family="Noto Serif CJK SC, serif" font-size="20" text-anchor="middle" fill="#222222">边权</text>
<path d="M200 65 L110 170" stroke="#777777" stroke-width="1.5"/>
<path d="M200 65 L300 170" stroke="#777777" stroke-width="1.5"/>
<path d="M110 170 L55 275" stroke="#777777" stroke-width="1.5"/>
<path d="M110 170 L175 275" stroke="#777777" stroke-width="1.5"/>
<circle cx="200" cy="65" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="200" y="72" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">1</text>
<circle cx="110" cy="170" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="110" y="177" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">3</text>
<circle cx="300" cy="170" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="300" y="177" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">4</text>
<circle cx="55" cy="275" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="55" y="282" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">2</text>
<circle cx="175" cy="275" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="175" y="282" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">5</text>
<text x="133" y="110" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">1</text>
<text x="270" y="110" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">10</text>
<text x="60" y="220" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">20</text>
<text x="166" y="220" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">20</text>
<text x="600" y="24" font-family="Noto Serif CJK SC, serif" font-size="20" text-anchor="middle" fill="#222222">点权</text>
<path d="M600 65 L510 170" stroke="#777777" stroke-width="1.5"/>
<path d="M600 65 L700 170" stroke="#777777" stroke-width="1.5"/>
<path d="M510 170 L455 275" stroke="#777777" stroke-width="1.5"/>
<path d="M510 170 L575 275" stroke="#777777" stroke-width="1.5"/>
<circle cx="600" cy="65" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="600" y="72" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">1</text>
<circle cx="510" cy="170" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="510" y="177" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">3</text>
<circle cx="700" cy="170" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="700" y="177" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">4</text>
<circle cx="455" cy="275" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="455" y="282" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">2</text>
<circle cx="575" cy="275" r="20" stroke="#222222" stroke-width="1.5" fill="#ffffff"/><text x="575" y="282" font-family="serif" font-size="21" text-anchor="middle" fill="#222222">5</text>
<text x="665" y="65" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">a = 0</text>
<text x="457" y="172" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">a = 1</text>
<text x="760" y="172" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">a = 10</text>
<text x="455" y="320" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">a = 20</text>
<text x="575" y="320" font-family="Noto Serif CJK SC, serif" font-size="19" text-anchor="middle" fill="#555555">a = 20</text>
</svg>
