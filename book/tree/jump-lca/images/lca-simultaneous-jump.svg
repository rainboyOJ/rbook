<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-labelledby="lca-jump-title lca-jump-desc">
  <title id="lca-jump-title">LCA 查询中的同时上跳</title>
  <desc id="lca-jump-desc">上下两个状态展示 a 和 b 从 LCA 下方的不同分支同时上跳。安全跳到 x 和 y 后，下一跳会汇合到节点 2，因此停止并返回 2。</desc>
  <style>
    .canvas { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #dbe4ef; stroke-width: 2; }
    .edge { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
    .edge-a { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; }
    .edge-b { fill: none; stroke: #d97706; stroke-width: 3; stroke-linecap: round; }
    .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
    .node-a { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .node-b { fill: #fff7ed; stroke: #d97706; stroke-width: 3; }
    .node-lca { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
    .label { fill: #1f2937; font: 600 18px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .small { fill: #64748b; font: 400 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .target-label { fill: #059669; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: start; dominant-baseline: central; }
    .stop-arrow { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 6 5; stroke-linecap: round; marker-end: url(#arrow-stop); }
    .transition-arrow { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow-transition); }
    .transition-label { fill: #2563eb; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
  </style>
  <defs>
    <marker id="arrow-transition" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-stop" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="canvas" width="560" height="640" />

  <g id="before-state">
    <rect class="panel" x="24" y="24" width="512" height="252" rx="8" />
    <text class="small" x="280" y="52">当前状态：a、b 同深</text>

    <g id="before-edges">
      <line class="edge" x1="280" y1="110" x2="280" y2="132" />
      <line class="edge-a" x1="280" y1="168" x2="220" y2="194" />
      <line class="edge-b" x1="280" y1="168" x2="340" y2="194" />
      <line class="edge-a" x1="220" y1="216" x2="220" y2="236" />
      <line class="edge-b" x1="340" y1="216" x2="340" y2="236" />
    </g>
    <g id="before-nodes">
      <circle class="node" cx="280" cy="88" r="22" />
      <circle class="node-lca" cx="280" cy="150" r="26" />
      <circle class="node" cx="220" cy="204" r="22" />
      <circle class="node" cx="340" cy="204" r="22" />
      <circle class="node-a" cx="220" cy="258" r="22" />
      <circle class="node-b" cx="340" cy="258" r="22" />
      <text class="label" x="280" y="88">1</text>
      <text class="label" x="280" y="150">2</text>
      <text class="label" x="220" y="204">x</text>
      <text class="label" x="340" y="204">y</text>
      <text class="label" x="220" y="258">a</text>
      <text class="label" x="340" y="258">b</text>
    </g>
  </g>

  <g id="transition">
    <line class="transition-arrow" x1="280" y1="292" x2="280" y2="334" />
    <text class="transition-label" x="350" y="313">同时上跳</text>
  </g>

  <g id="after-state">
    <rect class="panel" x="24" y="354" width="512" height="262" rx="8" />
    <text class="small" x="280" y="384">安全跳后：仍在不同分支</text>

    <g id="after-edges">
      <line class="edge" x1="280" y1="442" x2="280" y2="464" />
      <line class="edge-a" x1="280" y1="500" x2="220" y2="526" />
      <line class="edge-b" x1="280" y1="500" x2="340" y2="526" />
      <path class="stop-arrow" d="M 220 512 L 264 486" />
      <path class="stop-arrow" d="M 340 512 L 296 486" />
    </g>
    <g id="after-nodes">
      <circle class="node" cx="280" cy="420" r="22" />
      <circle class="node-lca" cx="280" cy="486" r="26" />
      <circle class="node-a" cx="220" cy="540" r="22" />
      <circle class="node-b" cx="340" cy="540" r="22" />
      <text class="label" x="280" y="420">1</text>
      <text class="label" x="280" y="486">2</text>
      <text class="target-label" x="312" y="486">LCA</text>
      <text class="label" x="220" y="540">x</text>
      <text class="label" x="340" y="540">y</text>
    </g>
    <text class="small" x="280" y="590">下一跳会汇合，停止</text>
  </g>
</svg>
