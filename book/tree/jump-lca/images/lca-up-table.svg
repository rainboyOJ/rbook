<svg xmlns="http://www.w3.org/2000/svg" width="560" height="580" viewBox="0 0 560 580" role="img" aria-labelledby="lca-up-title lca-up-desc">
  <title id="lca-up-title">倍增祖先表的填充示意</title>
  <desc id="lca-up-desc">上方树中从 u 到根的路径被突出显示，下方表格列出 u 的 1、2、4 级祖先，并用递推式说明 up[u][2] 如何由两次短跳得到。</desc>
  <style>
    .canvas { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #dbe4ef; stroke-width: 2; }
    .edge { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
    .edge-focus { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; }
    .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
    .node-focus { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .node-target { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
    .label { fill: #1f2937; font: 600 18px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .small { fill: #64748b; font: 400 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .table-head { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
    .table-cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .formula { fill: #ecfdf5; stroke: #bbf7d0; stroke-width: 1.5; }
    .formula-label { fill: #1f2937; font: 600 17px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .target-label { fill: #059669; font: 600 16px system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: start; dominant-baseline: central; }
  </style>
  <rect class="canvas" width="560" height="580" />

  <g id="tree">
    <rect class="panel" x="24" y="24" width="512" height="230" rx="8" />
    <text class="small" x="280" y="52">先沿父亲关系找到各级祖先</text>
    <g id="tree-edges">
      <line class="edge-focus" x1="280" y1="98" x2="280" y2="110" />
      <line class="edge-focus" x1="280" y1="152" x2="340" y2="174" />
      <line class="edge" x1="280" y1="152" x2="220" y2="174" />
      <line class="edge" x1="220" y1="196" x2="185" y2="218" />
      <line class="edge" x1="220" y1="196" x2="255" y2="218" />
    </g>
    <g id="tree-nodes">
      <circle class="node-focus" cx="280" cy="76" r="22" />
      <circle class="node-focus" cx="280" cy="130" r="22" />
      <circle class="node" cx="220" cy="184" r="22" />
      <circle class="node-target" cx="340" cy="184" r="26" />
      <circle class="node" cx="185" cy="230" r="18" />
      <circle class="node" cx="255" cy="230" r="18" />
      <text class="label" x="280" y="76">1</text>
      <text class="label" x="280" y="130">2</text>
      <text class="label" x="220" y="184">3</text>
      <text class="label" x="340" y="184">u</text>
      <text class="label" x="185" y="230">4</text>
      <text class="label" x="255" y="230">5</text>
      <text class="target-label" x="372" y="184">目标</text>
    </g>
  </g>

  <g id="ancestor-table">
    <rect class="panel" x="24" y="280" width="512" height="276" rx="8" />
    <text class="small" x="280" y="308">u 的祖先表</text>

    <g id="table-grid">
      <rect class="table-head" x="56" y="332" width="149" height="42" rx="8" />
      <rect class="table-head" x="205" y="332" width="149" height="42" rx="8" />
      <rect class="table-head" x="354" y="332" width="150" height="42" rx="8" />
      <rect class="table-cell" x="56" y="382" width="149" height="46" rx="8" />
      <rect class="table-cell" x="205" y="382" width="149" height="46" rx="8" />
      <rect class="table-cell" x="354" y="382" width="150" height="46" rx="8" />
      <rect class="table-cell" x="56" y="436" width="149" height="46" rx="8" />
      <rect class="table-cell" x="205" y="436" width="149" height="46" rx="8" />
      <rect class="table-cell" x="354" y="436" width="150" height="46" rx="8" />
      <text class="label" x="130" y="353">j = 0</text>
      <text class="label" x="279" y="353">j = 1</text>
      <text class="label" x="429" y="353">j = 2</text>
      <text class="small" x="130" y="405">跳 1 层</text>
      <text class="small" x="279" y="405">跳 2 层</text>
      <text class="small" x="429" y="405">跳 4 层</text>
      <text class="label" x="130" y="459">2</text>
      <text class="label" x="279" y="459">1</text>
      <text class="label" x="429" y="459">0</text>
    </g>

    <rect class="formula" x="88" y="496" width="384" height="40" rx="8" />
    <text class="formula-label" x="280" y="516">up[u][2] = up[1][1] = 0</text>
    <text class="small" x="280" y="548">0 表示不存在的祖先</text>
  </g>
</svg>
