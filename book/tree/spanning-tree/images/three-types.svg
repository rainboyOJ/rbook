<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="660" height="320" fill="#ffffff"/>

  <!-- 左：无向基环树 -->
  <text x="24" y="30" font-size="14" font-weight="700" fill="#172033">无向基环树</text>
  <text x="24" y="50" font-size="11" fill="#64748b">n 点 n 边，只有一个环</text>

  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <line x1="150" y1="110" x2="120" y2="70"/>
    <line x1="222" y1="152" x2="268" y2="122"/>
    <line x1="268" y1="122" x2="292" y2="76"/>
    <line x1="196" y1="205" x2="206" y2="252"/>
  </g>
  <g stroke="#dc2626" stroke-width="3" fill="none">
    <line x1="122" y1="155" x2="150" y2="110"/>
    <line x1="150" y1="110" x2="222" y2="152"/>
    <line x1="222" y1="152" x2="196" y2="205"/>
    <line x1="196" y1="205" x2="130" y2="200"/>
    <line x1="130" y1="200" x2="122" y2="155"/>
  </g>
  <g fill="#dc2626">
    <circle cx="122" cy="155" r="6"/><circle cx="150" cy="110" r="6"/>
    <circle cx="222" cy="152" r="6"/><circle cx="196" cy="205" r="6"/>
    <circle cx="130" cy="200" r="6"/>
  </g>
  <g fill="#64748b">
    <circle cx="120" cy="70" r="5"/><circle cx="268" cy="122" r="5"/>
    <circle cx="292" cy="76" r="5"/><circle cx="206" cy="252" r="5"/>
  </g>
  <text x="24" y="292" font-size="11" fill="#dc2626">红=环，其余是挂在环上的树</text>

  <line x1="330" y1="60" x2="330" y2="290" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 右：内向基环树 -->
  <text x="356" y="30" font-size="14" font-weight="700" fill="#172033">内向基环树</text>
  <text x="356" y="50" font-size="11" fill="#64748b">每点出度 = 1，沿箭头必进环</text>

  <g stroke="#dc2626" stroke-width="3" fill="none">
    <line x1="440" y1="160" x2="485" y2="120"/>
    <line x1="485" y1="120" x2="535" y2="152"/>
    <line x1="535" y1="152" x2="516" y2="205"/>
    <line x1="516" y1="205" x2="460" y2="210"/>
    <line x1="460" y1="210" x2="440" y2="160"/>
  </g>
  <g stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="482" y1="74"  x2="485" y2="113"/>
    <line x1="536" y1="104" x2="535" y2="145"/>
    <line x1="460" y1="256" x2="461" y2="217"/>
  </g>
  <g fill="#dc2626">
    <circle cx="440" cy="160" r="6"/><circle cx="485" cy="120" r="6"/>
    <circle cx="535" cy="152" r="6"/><circle cx="516" cy="205" r="6"/>
    <circle cx="460" cy="210" r="6"/>
  </g>
  <g fill="#64748b">
    <circle cx="482" cy="74" r="5"/><circle cx="536" cy="104" r="5"/><circle cx="460" cy="256" r="5"/>
  </g>
  <text x="356" y="292" font-size="11" fill="#7c3aed">环外的点都是树根，出边指向父亲</text>
</svg>
