<text x="764" y="227" font-size="23" fill="#b45309" text-anchor="middle" font-weight="700">5</text>
<rect x="425" y="200" width="200" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" />
<circle cx="110" cy="290" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="110" y="297" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="700">5</text>
<text x="225" y="297" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="400">[4, 5]</text>
<text x="330" y="297" font-size="23" fill="#1d4ed8" text-anchor="middle" font-weight="700">4</text>
<text x="764" y="297" font-size="23" fill="#b45309" text-anchor="middle" font-weight="700">5</text>
