<text x="330" y="367" font-size="23" fill="#1d4ed8" text-anchor="middle" font-weight="700">5</text>
<text x="764" y="367" font-size="23" fill="#b45309" text-anchor="middle" font-weight="700">5</text>
<rect x="575" y="340" width="50" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" />
<line x1="625" y1="191" x2="625" y2="390" stroke="#b45309" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="28" y="414" width="824" height="48" rx="8" fill="#dbeafe" stroke="none" />
<text x="440" y="445" font-size="20" fill="#1d4ed8" text-anchor="middle" font-weight="700">in：1 &lt; 2 &lt; 4 &lt; 5；out：7 ≥ 5 ≥ 5 ≥ 5</text>
