<rect x="384" y="88" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="423.0" y="119" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">5</text>
<rect x="466" y="88" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="505.0" y="119" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">2</text>
<rect x="548" y="88" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="587.0" y="119" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">6</text>
<rect x="630" y="88" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="669.0" y="119" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">3</text>
<rect x="712" y="88" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="751.0" y="119" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<text x="820" y="160" font-size="18" fill="#475569" text-anchor="end" font-weight="400">↓ 整行反转</text>
<text x="202" y="208" font-size="19" fill="#475569" text-anchor="end" font-weight="400">反向进入序</text>
<rect x="220" y="177" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="259.0" y="208" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<rect x="302" y="177" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="341.0" y="208" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">3</text>
<rect x="384" y="177" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="423.0" y="208" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">6</text>
<rect x="466" y="177" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="505.0" y="208" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">2</text>
<rect x="548" y="177" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="587.0" y="208" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">5</text>
<rect x="630" y="177" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="669.0" y="208" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">7</text>
<rect x="712" y="177" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="751.0" y="208" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">4</text>
<text x="220" y="254" font-size="19" fill="#1d4ed8" text-anchor="start" font-weight="400">这一行的位置就是 rdfn：rdfn₄ = 7，rdfn₇ = 6。</text>
<text x="28" y="306" font-size="21" fill="#0f172a" text-anchor="start" font-weight="700">把每个点画成 (in, rdfn)</text>
<rect x="141" y="446" width="204" height="255" rx="0" fill="#dbeafe" stroke="#1d4ed8" />
<line x1="141" y1="752" x2="141" y2="395" stroke="#e2e8f0" stroke-width="1" />
<line x1="90" y1="701" x2="447" y2="701" stroke="#e2e8f0" stroke-width="1" />
<text x="141" y="779" font-size="17" fill="#475569" text-anchor="middle" font-weight="400">1</text>
<text x="74" y="707" font-size="17" fill="#475569" text-anchor="end" font-weight="400">1</text>
<line x1="192" y1="752" x2="192" y2="395" stroke="#e2e8f0" stroke-width="1" />
