<line x1="90" y1="446" x2="447" y2="446" stroke="#e2e8f0" stroke-width="1" />
<text x="396" y="779" font-size="17" fill="#475569" text-anchor="middle" font-weight="400">6</text>
<text x="74" y="452" font-size="17" fill="#475569" text-anchor="end" font-weight="400">6</text>
<line x1="447" y1="752" x2="447" y2="395" stroke="#e2e8f0" stroke-width="1" />
<line x1="90" y1="395" x2="447" y2="395" stroke="#e2e8f0" stroke-width="1" />
<text x="447" y="779" font-size="17" fill="#475569" text-anchor="middle" font-weight="400">7</text>
<text x="74" y="401" font-size="17" fill="#475569" text-anchor="end" font-weight="400">7</text>
<line x1="90" y1="752" x2="477" y2="752" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<line x1="90" y1="752" x2="90" y2="367" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<text x="487" y="759" font-size="19" fill="#1d4ed8" text-anchor="start" font-weight="400">in</text>
<text x="90" y="352" font-size="19" fill="#1d4ed8" text-anchor="middle" font-weight="400">rdfn</text>
<circle cx="141" cy="701" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="141" y="708" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="700">1</text>
<circle cx="192" cy="548" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="192" y="555" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="700">2</text>
<circle cx="396" cy="650" r="18" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
<text x="396" y="657" font-size="21" fill="#475569" text-anchor="middle" font-weight="700">3</text>
<circle cx="243" cy="395" r="18" fill="#ffedd5" stroke="#b45309" stroke-width="2.5"/>
<text x="243" y="402" font-size="21" fill="#b45309" text-anchor="middle" font-weight="700">4</text>
<circle cx="294" cy="497" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="294" y="504" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="700">5</text>
<circle cx="447" cy="599" r="18" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
<text x="447" y="606" font-size="21" fill="#475569" text-anchor="middle" font-weight="700">6</text>
<circle cx="345" cy="446" r="18" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2.5"/>
<text x="345" y="453" font-size="21" fill="#7e22ce" text-anchor="middle" font-weight="700">7</text>
<rect x="520" y="363" width="330" height="108" rx="6" fill="#f3e8ff" stroke="none" />
<text x="540" y="397" font-size="22" fill="#7e22ce" text-anchor="start" font-weight="700">查询点 7：(5, 6)</text>
<text x="540" y="429" font-size="19" fill="#7e22ce" text-anchor="start" font-weight="400">同时满足 in ≤ 5、rdfn ≤ 6</text>
<text x="540" y="456" font-size="19" fill="#7e22ce" text-anchor="start" font-weight="400">就是蓝色矩形内的点。</text>
<text x="532" y="518" font-size="19" fill="#1d4ed8" text-anchor="start" font-weight="700">点 5：(4, 5)  →  在矩形内</text>
<text x="532" y="551" font-size="18" fill="#0f172a" text-anchor="start" font-weight="400">两次都更早，是 7 的祖先。</text>
<text x="532" y="607" font-size="19" fill="#b45309" text-anchor="start" font-weight="700">点 4：(3, 7)  →  在矩形外</text>
<text x="532" y="640" font-size="18" fill="#0f172a" text-anchor="start" font-weight="400">in 虽然更小，rdfn 却更大，</text>
<text x="532" y="670" font-size="18" fill="#0f172a" text-anchor="start" font-weight="400">第二维排除了这个旁支。</text>
<text x="440" y="819" font-size="20" fill="#475569" text-anchor="middle" font-weight="400">圈内数字是点编号；蓝色矩形也包含点 7 自己。</text>
</g>
</svg>
