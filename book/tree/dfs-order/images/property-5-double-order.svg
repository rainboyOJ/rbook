<svg xmlns="http://www.w3.org/2000/svg" width="880" height="850" viewBox="0 0 880 850" role="img" aria-labelledby="title desc">
<title id="title">P5 · 两个方向都排在前面，才是祖先</title>
<desc id="desc">退出序反转得到反向 DFS 的进入序。点 7 的坐标为 (5,6)，左下矩形内有 1、2、5、7。点 4 的坐标 (3,7) 在矩形外。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="880" height="850" rx="16" fill="#fff" stroke="#cbd5e1" />
<text x="28" y="40" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">P5 · 两个方向都排在前面，才是祖先</text>
<text x="202" y="119" font-size="19" fill="#475569" text-anchor="end" font-weight="400">后序（退出序）</text>
<rect x="220" y="88" width="78" height="46" rx="6" fill="#f8fafc" stroke="#475569" />
<text x="259.0" y="119" font-size="22" fill="#475569" text-anchor="middle" font-weight="700">4</text>
