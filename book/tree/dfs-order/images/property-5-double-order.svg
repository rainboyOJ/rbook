<line x1="294" y1="752" x2="294" y2="395" stroke="#e2e8f0" stroke-width="1" />
<line x1="90" y1="548" x2="447" y2="548" stroke="#e2e8f0" stroke-width="1" />
<text x="294" y="779" font-size="17" fill="#475569" text-anchor="middle" font-weight="400">4</text>
