<text x="28" y="40" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">子树求和 · 点权跟着点，搬到 DFS 序的位置</text>
<line x1="190" y1="100" x2="120" y2="178" stroke="#cbd5e1" stroke-width="3" />
