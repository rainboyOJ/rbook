<svg xmlns="http://www.w3.org/2000/svg" width="880" height="730" viewBox="0 0 880 730" role="img" aria-labelledby="title desc">
<title id="title">子树求和 · 点权跟着点，搬到 DFS 序的位置</title>
<desc id="desc">点权按点 1 到 7 分别是 8、3、6、2、5、4、7。先序 1、2、4、5、7、3、6 对应权值数组 8、3、2、5、7、6、4。子树 2 的区间 [2,5] 的和为 17。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
