<svg xmlns="http://www.w3.org/2000/svg" width="560" height="510" viewBox="0 0 560 510" role="img" aria-labelledby="title desc">
<title id="title">路径与子树对应的数组区间</title>
<desc id="desc">路径 2 到 4 分为区间 5 到 5 和 1 到 3；子树 3 对应区间 2 到 4。</desc>
<style>.canvas{fill:#ffffff}.edge{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 5}.heavy{stroke:#2563eb;stroke-width:3;fill:none}.node{fill:#ffffff;stroke:#64748b;stroke-width:2}.cell{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.sub{fill:#ecfdf5;stroke:#059669;stroke-width:2}.label{fill:#1f2937;font:600 20px system-ui,"Noto Sans CJK SC",sans-serif;text-anchor:middle;dominant-baseline:central}</style>
<rect class="canvas" width="560" height="510"/>
<text class="label" x="280" y="40">路径 2 → 1 → 3 → 4</text>
<text class="label" x="65" y="100">节点</text>
<text class="label" x="65" y="150">dfn</text>
<rect class="node" x="115" y="75" width="60" height="50" rx="8"/><text class="label" x="145" y="100">1</text>
<text class="label" x="145" y="150">1</text>
<rect class="node" x="193" y="75" width="60" height="50" rx="8"/><text class="label" x="223" y="100">3</text>
<text class="label" x="223" y="150">2</text>
<rect class="node" x="271" y="75" width="60" height="50" rx="8"/><text class="label" x="301" y="100">4</text>
<text class="label" x="301" y="150">3</text>
<rect class="node" x="349" y="75" width="60" height="50" rx="8"/><text class="label" x="379" y="100">5</text>
<text class="label" x="379" y="150">4</text>
<rect class="node" x="427" y="75" width="60" height="50" rx="8"/><text class="label" x="457" y="100">2</text>
<text class="label" x="457" y="150">5</text>
<g id="path"><rect class="cell" x="427" y="195" width="60" height="48" rx="8"/><text class="label" x="457" y="219">2</text>
<text class="label" x="220" y="219">① [5,5]：2 → 1</text>
<rect class="cell" x="115" y="275" width="216" height="48" rx="8"/><text class="label" x="223" y="299">1 → 3 → 4</text>
<text class="label" x="420" y="299">② [1,3]</text>
</g><g id="subtree"><rect class="sub" x="193" y="385" width="216" height="48" rx="8"/><text class="label" x="301" y="409">3、4、5</text>
<text class="label" x="280" y="470">子树 3：[2,4]</text>
</g>
</svg>
