<style>.edge{stroke:#555;stroke-width:1.5}.node{fill:#fff;stroke:#222;stroke-width:1.5}.label{fill:#222;font:20px Georgia,"Noto Serif CJK SC",SimSun,serif;text-anchor:middle;dominant-baseline:central}.caption{font-size:16px}</style>
