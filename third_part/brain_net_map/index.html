<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>文章关系 · Rbook</title>
<style>html{background:#f7f8f6;color-scheme:light}html[data-theme="dark"]{background:#191e1c;color-scheme:dark}</style></head>
<body>
<header class="masthead"><a href="/" class="brand">RBOOK<span>算法电子书</span></a><h1>文章关系<span class="dot">.</span></h1><div class="header-actions"><button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题" aria-pressed="false">
<svg class="theme-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
<svg class="theme-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
</button><a class="back" href="/">返回阅读 ↗</a></div></header>
<main id="workspace" aria-label="文章知识地图">
  <div id="graph" tabindex="0" role="region" aria-label="知识地图画布。拖动平移，滚轮或双指缩放；也可使用搜索和右下角按钮。"></div>
  <section class="toolbar" aria-label="地图工具">
    <label>范围<select id="chapter"><option value="all">全书</option></select></label>
    <label>视图<select id="layout"></select></label>
    <div class="search-wrap"><label for="search" class="sr-only">查找文章</label><input id="search" type="search" placeholder="查找文章…" autocomplete="off" aria-controls="results" aria-expanded="false"><div id="results" hidden></div></div>
  </section>
  <div class="map-caption"><span id="kind" class="mode-badge">前置关系</span><h2 id="view-title">知识网络</h2><p id="view-description">自由探索文章之间的联系</p><p id="counts"></p></div>
  <aside id="detail" hidden aria-label="文章详情"><button id="close-detail" class="close" aria-label="关闭详情">×</button><div id="detail-content"></div></aside>
  <div id="tooltip" hidden role="tooltip"></div>
  <div class="canvas-footer"><span class="hint">拖动平移 · 滚轮缩放 · 单击查看 · 双击阅读</span><span id="legend">箭头：前置知识 → 后续文章</span></div>
  <nav class="zoom-tools" aria-label="画布缩放"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom" aria-label="缩放比例">100%</output><button id="zoom-in" aria-label="放大">＋</button><span class="divider"></span><button id="fit" title="适应画布">适应</button><button id="reset" title="恢复当前视图">重置</button></nav>
  <div id="loading" role="status"><span class="loading-mark"></span><p>正在展开知识地图…</p></div>
  <div id="error" hidden role="alert"><strong>画布加载失败</strong><p>请重试，或返回文章继续阅读。</p><button id="retry">重新加载</button></div>
  <p id="announcement" class="sr-only" aria-live="polite"></p>
</main><script type="module" src="./app.js"></script>
</body></html>
