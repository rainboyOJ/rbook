# 中文目录英文化后的旧地址兼容。由 deploy.sh 安装到站点的 extension/ 目录。
# server 级 rewrite 会在 location 匹配前执行；保留后续文件路径和查询参数。

rewrite ^/string/最小表示法(/.*)?$ /string/minimal_rotation$1 permanent;
rewrite ^/string/进制hash(/.*)?$ /string/string_hash$1 permanent;
rewrite ^/math/numberTheory/约数(/.*)?$ /math/numberTheory/divisors$1 permanent;
rewrite ^/greedy/均分纸牌(/.*)?$ /greedy/equalize_cards$1 permanent;
rewrite ^/graph/图论及其应用读书笔记(/.*)?$ /graph/graph_theory_notes$1 permanent;
rewrite ^/dynamic_programming/knapsack/exercises/整数划分(/.*)?$ /dynamic_programming/knapsack/exercises/integer_partition$1 permanent;

# 模板下载地址与论文目录浏览入口。
rewrite ^/code_template/string/最小表示法(/.*)?$ /code_template/string/minimal_rotation$1 permanent;
rewrite ^/code_template/string/进制hash(/.*)?$ /code_template/string/string_hash$1 permanent;
rewrite ^/assets/papers/我的杂记(/.*)?$ /assets/papers/personal_notes$1 permanent;
rewrite ^/papers/我的杂记(/.*)?$ /papers/personal_notes$1 permanent;
