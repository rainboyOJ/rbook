# /papers/ 目录浏览（nginx-file-browser 风格）
#
# 由 deploy.sh 安装到服务器：
#   /www/server/panel/vhost/nginx/extension/rbook.roj.ac.cn/papers.conf
#
# 放进 extension 目录而不是主 vhost 配置，是因为主配置由宝塔面板托管——
# 在面板里改「伪静态」或保存站点设置时会被重写，手改的 location 会丢。
# extension 目录被主配置第 13 行 include，面板不管它。
#
# 依赖 assets/autoindex/ 下的 header.html / footer.html（随 dist 一起部署）。
# 详见 docs/nginx-papers-autoindex.md。

location = /papers {
    return 301 /papers/;
}

location /papers/ {
    # PDF 在仓库里就在 assets/papers/，构建时 rsync 进 dist/assets/papers/，
    # 部署后落在下面这个路径。早先写成 .../rbook.roj.ac.cn/papers/ 是错的，
    # 那个目录不存在，所以整站 404。
    alias /www/wwwroot/rbook.roj.ac.cn/assets/papers/;

    autoindex on;
    # 必须用 json：assets/autoindex/header.html 里那段 JS 读的是页面内嵌的
    # JSON 数组，靠它自己建表（搜索 / 排序 / 主题）。
    autoindex_format json;
    autoindex_localtime on;

    add_before_body /assets/autoindex/header.html;
    add_after_body /assets/autoindex/footer.html;

    # autoindex_format json 会在输出前把 Content-Type 定死成 application/json，
    # 浏览器就不会当 HTML 渲染（直接显示 JSON 源码）。
    # 实测 default_type text/html 和 types { } 都改不动它，只能用 lua 覆盖。
    #
    # 判据不能省：同一个 location 也在服务 PDF 本身，无条件覆盖会把
    # application/pdf 改成 text/html，浏览器就不再调用 PDF 阅读器了。
    header_filter_by_lua_block {
        if ngx.header.content_type == "application/json" then
            ngx.header.content_type = "text/html; charset=utf-8"
        end
    }
}
