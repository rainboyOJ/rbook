<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Rbook</title>
    <%- include("./component/head.html")%>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.scss"/>
  </head>
  <body>
    <%- include("./component/git-corner.ejs") %>

    <button class="button-menu" id="menu-toggle" type="button" aria-label="打开目录" aria-controls="sidebar" aria-expanded="false">☰</button>
    <div class="container">
        <div class="header sticky-footer__header" style="display: none;">
            <div style="max-width: 1298px;margin:0 auto;">
                <%- include("component/header.html")%>
            </div>
        </div>
        <div class="main sticky-footer__main rbook-layout" style="">
            <div class="rbook-sidebar box" id="sidebar">
                <nav aria-label="文章目录"><%- menu.html %></nav>
            </div>
            <div class="article rbook-main box">
                <article class="rbook-article">
                    <h1>Rbook 算法书</h1>
                    <p>从左侧目录选择一篇文章开始阅读。</p>
                </article>
            </div>
        </div>

        <footer class="sticky-footer__footer" style="display: none;">
            this is footer
        </footer>
    </div>
    <script type="module" src="/js/site-shell.js"></script>
  </body>
</html>
